<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F1b · 手记河道 v2（斜向 · 拓宽 · 双引导线）</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#061c25; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }
      svg.canvas { position:absolute; inset:0; width:1440px; height:900px; }
      .ov { position:absolute; }
      h1 { font-size:82px; font-weight:700; line-height:1; transform:rotate(-1.4deg); }
      .sub { margin-top:14px; font-size:15.5px; line-height:1.9; color:var(--muted); }
      .note { font-size:13px; line-height:1.85; color:rgba(243,249,250,.74); }
      .note b { color:var(--glass); font-weight:400; }
      .cat { font-family:Quattrocento,serif; font-size:11px; letter-spacing:.24em; color:rgba(243,249,250,.5); }

      .port { position:absolute; display:grid; place-items:center; cursor:pointer; }
      .port i { position:absolute; border-radius:50%; }
      .port .r1 { inset:0; border:1px solid rgba(127,209,217,.4); }
      .port .r2 { inset:24px; border:1px solid rgba(127,209,217,.48); }
      .port .r3 { inset:48px; border:1px solid rgba(224,246,249,.55); }
      .port .core { position:relative; width:104px; height:104px; border-radius:50%; display:grid; place-items:center; gap:2px;
        font-family:inherit; font-size:16px; font-weight:700; letter-spacing:.14em; color:#fff; }
      .port .core span { font-size:10px; letter-spacing:.28em; opacity:.75; font-weight:400; }
      .draw .core { background:linear-gradient(180deg,#12798d,#0b4e5b); box-shadow:0 0 0 8px rgba(6,28,37,.8), 0 12px 34px rgba(0,0,0,.45); }
      .cast .core { background:linear-gradient(180deg,#d2502f,#9d4125); box-shadow:0 0 0 8px rgba(6,28,37,.8), 0 12px 34px rgba(0,0,0,.45); }
      .port .cap { position:absolute; width:280px; font-size:12.5px; line-height:1.75; color:var(--muted);
        text-shadow:0 1px 8px rgba(3,20,26,.95); }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:3px; }

      footer { position:absolute; left:76px; right:76px; bottom:30px; display:flex; align-items:center; gap:10px; }
      .tag { background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px;
        padding:8px 15px; cursor:pointer; letter-spacing:.1em; }
      .tag[aria-pressed='true'] { border-color:rgba(127,209,217,.6); color:var(--paper); }
      footer .go { margin-left:auto; font-size:13px; color:var(--glass); text-decoration:none; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <svg class="canvas" viewBox="0 0 1440 900">
      <defs>
        <pattern id="ruled" width="1440" height="30" patternUnits="userSpaceOnUse">
          <line x1="0" y1="29.5" x2="1440" y2="29.5" stroke="rgba(127,209,217,.06)" stroke-width="1" />
        </pattern>
        <linearGradient id="riverG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0a3242" stop-opacity=".8" />
          <stop offset=".3" stop-color="#2a9db1" stop-opacity=".5" />
          <stop offset=".5" stop-color="#9fe6ed" stop-opacity=".34" />
          <stop offset=".72" stop-color="#2a9db1" stop-opacity=".5" />
          <stop offset="1" stop-color="#0a3242" stop-opacity=".8" />
        </linearGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#061c25" stop-opacity=".7" />
          <stop offset=".35" stop-color="#061c25" stop-opacity="0" />
          <stop offset="1" stop-color="#03131a" stop-opacity=".55" />
        </linearGradient>
        <radialGradient id="vig" cx=".5" cy=".45" r=".72">
          <stop offset=".5" stop-color="#000" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity=".5" />
        </radialGradient>
        <!-- 河道：自右上流向左下，两条岸各自蜿蜒（拓宽到 ~320–440px，两个按钮都落在水里） -->
        <clipPath id="riverClip">
          <path d="M1146 -20 C 1120 90, 1040 150, 946 214 C 852 278, 806 336, 764 402 C 722 468, 646 520, 552 578 C 458 636, 392 712, 344 800 C 314 856, 250 890, 196 920 L 452 920 C 512 884, 566 838, 610 776 C 654 714, 736 654, 830 592 C 924 530, 996 470, 1036 400 C 1076 330, 1108 250, 1160 176 C 1240 66, 1330 -30, 1372 -140 Z" />
        </clipPath>
      </defs>

      <rect width="1440" height="900" fill="#061c25" />
      <rect width="1440" height="900" fill="url(#ruled)" />

      <!-- 月光顺着河道拉出的一条细长反光（压低强度：原来像第二条河） -->
      <ellipse cx="1010" cy="230" rx="120" ry="400" fill="rgba(207,233,238,.035)" transform="rotate(-52 1010 230)" />
      <ellipse cx="1120" cy="90" rx="46" ry="150" fill="rgba(247,242,228,.07)" transform="rotate(-52 1120 90)" />

      <!-- 河道本体 -->
      <path d="M1146 -20 C 1120 90, 1040 150, 946 214 C 852 278, 806 336, 764 402 C 722 468, 646 520, 552 578 C 458 636, 392 712, 344 800 C 314 856, 250 890, 196 920 L 452 920 C 512 884, 566 838, 610 776 C 654 714, 736 654, 830 592 C 924 530, 996 470, 1036 400 C 1076 330, 1108 250, 1160 176 C 1240 66, 1330 -30, 1372 -140 Z"
        fill="url(#riverG)" />

      <g clip-path="url(#riverClip)">
        <!-- 只留三条岸线等高线：水面上不再堆细节 -->
        <g fill="none" stroke="rgba(216,243,246,.2)" stroke-width="1">
          <path d="M1128 -20 C 1102 88, 1026 148, 932 210 C 838 272, 792 330, 750 396 C 708 462, 632 514, 538 572 C 444 630, 380 706, 332 794 C 304 848, 242 884, 190 914" />
          <path d="M1160 -20 C 1140 84, 1072 140, 986 202 C 900 264, 856 322, 814 388 C 772 454, 700 508, 606 566 C 512 624, 444 700, 396 788 C 368 842, 306 880, 252 910" />
          <path d="M1080 -20 C 1060 92, 992 156, 902 220 C 812 284, 768 342, 726 406 C 684 470, 606 522, 514 580 C 422 638, 358 714, 312 802 C 286 856, 226 890, 176 918" />
        </g>
        <!-- 一条主流漂移虚线：水在流 -->
        <path d="M1116 -20 C 1092 96, 1014 156, 922 220 C 830 284, 784 342, 742 406 C 700 470, 626 522, 532 580 C 438 638, 376 714, 330 802 C 304 856, 244 890, 200 916"
          fill="none" stroke="rgba(243,249,250,.45)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="20 34" />
        <!-- 少量水面反光 -->
        <g fill="rgba(240,252,254,.45)">
          <circle cx="1090" cy="120" r="2.2" /><circle cx="950" cy="252" r="1.8" /><circle cx="840" cy="380" r="2" />
          <circle cx="700" cy="480" r="1.7" /><circle cx="596" cy="586" r="2.1" /><circle cx="470" cy="700" r="1.8" />
        </g>
        <!-- 两块礁石（压低对比：原来读成一个"洞"） -->
        <ellipse cx="880" cy="352" rx="48" ry="17" fill="rgba(3,19,26,.3)" />
        <ellipse cx="880" cy="348" rx="34" ry="11" fill="rgba(127,209,217,.14)" />
        <ellipse cx="560" cy="672" rx="58" ry="20" fill="rgba(3,19,26,.32)" />
        <ellipse cx="560" cy="666" rx="42" ry="13" fill="rgba(127,209,217,.13)" />
      </g>

      <!-- 两条岸线 -->
      <path d="M1146 -20 C 1120 90, 1040 150, 946 214 C 852 278, 806 336, 764 402 C 722 468, 646 520, 552 578 C 458 636, 392 712, 344 800 C 314 856, 250 890, 196 920"
        fill="none" stroke="rgba(216,243,246,.46)" stroke-width="1.8" />
      <path d="M1372 -140 C 1330 -30, 1240 66, 1160 176 C 1108 250, 1076 330, 1036 400 C 996 470, 924 530, 830 592 C 736 654, 654 714, 610 776 C 566 838, 512 884, 452 920"
        fill="none" stroke="rgba(216,243,246,.38)" stroke-width="1.8" />
      <!-- 岸线外侧的手绘短刻线 -->
      <g stroke="rgba(127,209,217,.24)" stroke-width="1.2" stroke-linecap="round">
        <path d="M1128 40 l-18 -8" /><path d="M1052 122 l-19 -6" /><path d="M958 194 l-20 -4" />
        <path d="M860 282 l-20 -2" /><path d="M778 372 l-20 -1" /><path d="M700 448 l-20 1" />
        <path d="M606 530 l-20 2" /><path d="M512 606 l-20 3" /><path d="M418 692 l-20 5" />
        <path d="M340 790 l-20 6" /><path d="M1196 210 l17 -12" /><path d="M1108 318 l18 -10" />
        <path d="M1010 412 l18 -8" /><path d="M912 506 l18 -6" /><path d="M812 596 l18 -4" />
        <path d="M706 686 l18 -2" /><path d="M618 782 l18 0" /><path d="M520 872 l18 2" />
      </g>
      <!-- 右岸岸上：小树剪影 -->
      <g fill="#03131a" opacity=".9">
        <path d="M1216 84 l15 -38 l15 38 z" /><path d="M1220 84 h22 v6 h-22 z" />
        <path d="M1290 236 l13 -32 l13 32 z" /><path d="M1294 236 h18 v5 h-18 z" />
        <path d="M764 726 l16 -40 l16 40 z" /><path d="M768 726 h24 v7 h-24 z" />
      </g>
      <!-- 河上远处一只小舟 -->
      <g transform="translate(1150 130) rotate(-46)" opacity=".75">
        <path d="M-24 0 C -11 9, 11 9, 24 0 C 15 13, -15 13, -24 0 Z" fill="#03131a" />
        <path d="M0 -15 L 0 2" stroke="#03131a" stroke-width="2" />
        <path d="M0 -15 L 15 -6 L 0 -2 Z" fill="rgba(243,249,250,.45)" />
      </g>

      <rect width="1440" height="900" fill="url(#fade)" />
      <rect width="1440" height="900" fill="url(#vig)" />
    </svg>

    <!-- 两条手绘引导线：一条指向捞取，一条指向投下（上一条被删掉了，这版都留着） -->
    <svg class="ov" style="left:0; top:0" width="1440" height="900" viewBox="0 0 1440 900">
      <path d="M416 706 C 470 700, 520 686, 566 668" fill="none" stroke="rgba(243,249,250,.42)" stroke-width="1.6" />
      <path d="M556 660 L 572 664 L 560 678" fill="none" stroke="rgba(243,249,250,.55)" stroke-width="1.6" stroke-linecap="round" />
      <path d="M948 214 C 990 218, 1020 226, 1052 238" fill="none" stroke="rgba(243,249,250,.42)" stroke-width="1.6" />
      <path d="M1040 232 L 1056 240 L 1042 252" fill="none" stroke="rgba(243,249,250,.55)" stroke-width="1.6" stroke-linecap="round" />
    </svg>

    <!-- 覆盖层 -->
    <div class="ov" style="left:76px; top:92px; width:520px">
      <div class="cat">MDB—0001 · 河道观测手记</div>
      <h1 style="margin-top:12px">暖流河道</h1>
      <p class="sub">河只有一条。瓶子顺水往下，一次只在一个人的手里 ——<br />谁捞到，谁就接下一句。</p>
    </div>

    <div class="note ov" style="left:120px; top:672px; width:270px; transform:rotate(-2.2deg)">
      <b>① 捞取</b><br />河里漂着别人的半句歌。点一下，它顺水到你手上。
    </div>
    <div class="note ov" style="left:700px; top:150px; width:230px; transform:rotate(1.6deg)">
      <b>② 投下</b><br />你录一段，封进瓶子，放进上游。
    </div>

    <!-- 圆形主按钮：两个都在河道里 -->
    <div class="port draw ov" style="left:508px; top:590px; width:156px; height:156px" role="button" aria-label="捞一个漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="left:-108px; top:172px"><b>捞一个漂流瓶</b>捞到即持有：同一时刻，同一条河道上只有你拿着它。</span>
    </div>
    <div class="port cast ov" style="left:962px; top:158px; width:156px; height:156px" role="button" aria-label="投下一支漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="left:184px; top:6px"><b>投下一支漂流瓶</b>选一首歌，录下第 1 段，然后放进上游等一个陌生人接下一棒。</span>
    </div>

    <div class="ov" style="right:76px; top:96px; text-align:right">
      <div class="cat" style="letter-spacing:.18em">观测者 · layoutmui6k36v</div>
      <div class="cat" style="margin-top:6px; letter-spacing:.18em">河道只能随机打捞，没有搜索</div>
      <svg width="70" height="70" viewBox="0 0 74 74" style="margin-top:16px; transform:rotate(6deg)">
        <circle cx="37" cy="37" r="33" fill="none" stroke="rgba(199,69,44,.85)" stroke-width="2.4" />
        <path d="M16 32c6-7 12-7 18 0s12 7 18 0" fill="none" stroke="rgba(199,69,44,.9)" stroke-width="3" stroke-linecap="round" />
        <path d="M16 44c6-7 12-7 18 0s12 7 18 0" fill="none" stroke="rgba(199,69,44,.9)" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
