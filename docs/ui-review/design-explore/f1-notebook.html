<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F1 · 手记河道 Field Notebook</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#061c25; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }
      svg.canvas { position:absolute; inset:0; width:1440px; height:900px; }

      /* 覆盖层：与 SVG 同一坐标系（1440×900，1:1），所以坐标可以直接对得上 */
      .ov { position:absolute; }
      h1 { font-size:86px; font-weight:700; line-height:1; transform:rotate(-1.6deg); letter-spacing:.01em; }
      .sub { margin-top:16px; font-size:16px; line-height:1.9; color:var(--muted); }
      .note { font-size:13px; line-height:1.85; color:rgba(243,249,250,.72); }
      .note b { color:var(--glass); font-weight:400; }
  .cat { font-family:Quattrocento,serif; font-size:11px; letter-spacing:.24em; color:rgba(243,249,250,.5); }
      .mono { font-family:ui-monospace,Consolas,monospace; }

      /* 圆形主按钮（保留既有形态：圆 + 三圈涟漪环），只是现在骑在河上 */
      .port { position:absolute; display:grid; place-items:center; cursor:pointer; }
      .port i { position:absolute; border-radius:50%; }
      .port .r1 { inset:0; border:1px solid rgba(127,209,217,.42); }
      .port .r2 { inset:22px; border:1px solid rgba(127,209,217,.5); }
      .port .r3 { inset:44px; border:1px solid rgba(224,246,249,.55); }
      .port .core { position:relative; width:96px; height:96px; border-radius:50%; display:grid; place-items:center; gap:2px;
        font-family:inherit; font-size:15px; font-weight:700; letter-spacing:.14em; color:#fff; }
      .port .core span { font-size:9.5px; letter-spacing:.28em; opacity:.75; font-weight:400; }
      .draw .core { background:linear-gradient(180deg,#12798d,#0b4e5b); box-shadow:0 0 0 7px rgba(6,28,37,.85), 0 10px 30px rgba(0,0,0,.45); }
      .cast .core { background:linear-gradient(180deg,#d2502f,#9d4125); box-shadow:0 0 0 7px rgba(6,28,37,.85), 0 10px 30px rgba(0,0,0,.45); }
      .port .cap { position:absolute; top:calc(100% + 10px); width:260px; text-align:center; font-size:12.5px; color:var(--muted); line-height:1.7; }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:3px; }

      footer { position:absolute; left:76px; right:76px; bottom:30px; display:flex; align-items:center; gap:10px; }
      .tag { background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px;
        padding:8px 15px; cursor:pointer; letter-spacing:.1em; }
      .tag[aria-pressed='true'] { border-color:rgba(127,209,217,.6); color:var(--paper); }
      footer .go { margin-left:auto; font-size:13px; color:var(--glass); text-decoration:none; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <svg class="canvas" viewBox="0 0 1440 900">
      <defs>
        <pattern id="ruled" width="1440" height="30" patternUnits="userSpaceOnUse">
          <line x1="0" y1="29.5" x2="1440" y2="29.5" stroke="rgba(127,209,217,.07)" stroke-width="1" />
        </pattern>
        <linearGradient id="riverG" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0b3a4a" stop-opacity=".85" />
          <stop offset=".28" stop-color="#2a9db1" stop-opacity=".55" />
          <stop offset=".5" stop-color="#8fe0e8" stop-opacity=".38" />
          <stop offset=".72" stop-color="#2a9db1" stop-opacity=".55" />
          <stop offset="1" stop-color="#0b3a4a" stop-opacity=".85" />
        </linearGradient>
        <linearGradient id="fade" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#061c25" stop-opacity=".85" />
          <stop offset=".22" stop-color="#061c25" stop-opacity=".1" />
          <stop offset=".8" stop-color="#061c25" stop-opacity="0" />
          <stop offset="1" stop-color="#03131a" stop-opacity=".7" />
        </linearGradient>
        <radialGradient id="vig" cx=".5" cy=".42" r=".7">
          <stop offset=".55" stop-color="#000" stop-opacity="0" />
          <stop offset="1" stop-color="#000" stop-opacity=".5" />
        </radialGradient>
        <clipPath id="riverClip">
          <path d="M895 -20 C 915 130, 826 270, 796 410 C 766 550, 682 672, 642 812 C 626 862, 610 898, 600 920 L 768 920 C 776 908, 788 890, 800 852 C 830 712, 902 584, 924 436 C 946 288, 1020 140, 985 -20 Z" />
        </clipPath>
      </defs>

      <rect width="1440" height="900" fill="#061c25" />
      <rect width="1440" height="900" fill="url(#ruled)" />

      <!-- 月光落在水面上：顺着河道拉出的一条细长反光，而不是一坨光斑 -->
      <ellipse cx="948" cy="180" rx="128" ry="420" fill="rgba(207,233,238,.07)" transform="rotate(13 948 180)" />
      <ellipse cx="936" cy="70" rx="40" ry="150" fill="rgba(247,242,228,.12)" transform="rotate(13 936 70)" />

      <!-- 河道本体：一条自上而下流来的水（单支路 —— 只有这一条） -->
      <path d="M895 -20 C 915 130, 826 270, 796 410 C 766 550, 682 672, 642 812 C 626 862, 610 898, 600 920 L 768 920 C 776 908, 788 890, 800 852 C 830 712, 902 584, 924 436 C 946 288, 1020 140, 985 -20 Z"
        fill="url(#riverG)" />

      <g clip-path="url(#riverClip)">
        <!-- 水面等高线：贴着河岸走，越靠岸越密 -->
        <g fill="none" stroke="rgba(216,243,246,.2)" stroke-width="1">
          <path d="M880 40 C 856 210, 792 380, 716 548 C 668 658, 606 780, 528 900" />
          <path d="M900 60 C 880 214, 822 378, 748 542 C 702 646, 646 768, 574 890" />
          <path d="M944 90 C 932 232, 880 380, 812 536 C 770 630, 720 752, 656 880" />
          <path d="M976 130 C 972 258, 928 386, 868 530 C 830 622, 786 744, 730 872" />
        </g>
        <!-- 主流的漂移虚线（水在流） -->
        <g fill="none" stroke="rgba(243,249,250,.5)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="18 30">
          <path d="M930 20 C 908 210, 848 388, 782 552 C 742 650, 690 780, 616 910" />
        </g>
        <g fill="none" stroke="rgba(243,249,250,.26)" stroke-width="2" stroke-linecap="round" stroke-dasharray="10 44">
          <path d="M874 40 C 856 200, 800 380, 736 540 C 700 634, 652 764, 584 900" />
        </g>
        <!-- 水面反光的碎点 -->
        <g fill="rgba(240,252,254,.5)">
          <circle cx="900" cy="150" r="2.2" /><circle cx="946" cy="196" r="1.6" /><circle cx="864" cy="236" r="2" />
          <circle cx="906" cy="300" r="1.7" /><circle cx="842" cy="352" r="2.4" /><circle cx="880" cy="420" r="1.8" />
          <circle cx="812" cy="478" r="2.1" /><circle cx="760" cy="540" r="1.6" /><circle cx="800" cy="600" r="2.2" />
          <circle cx="716" cy="656" r="1.7" /><circle cx="678" cy="726" r="2.3" /><circle cx="640" cy="800" r="1.9" />
        </g>
        <!-- 水下的礁石（带一圈浅色晕） -->
        <g>
          <ellipse cx="820" cy="470" rx="54" ry="20" fill="rgba(3,19,26,.55)" />
          <ellipse cx="820" cy="466" rx="40" ry="13" fill="rgba(127,209,217,.22)" />
          <ellipse cx="700" cy="690" rx="66" ry="24" fill="rgba(3,19,26,.6)" />
          <ellipse cx="700" cy="684" rx="50" ry="16" fill="rgba(127,209,217,.2)" />
          <ellipse cx="900" cy="240" rx="34" ry="12" fill="rgba(3,19,26,.45)" />
        </g>
        <!-- 一片沙洲 -->
        <path d="M846 356 C 892 344, 936 356, 950 374 C 934 392, 878 396, 846 384 Z" fill="rgba(207,233,238,.16)" />
        <!-- 浮叶 -->
        <g fill="rgba(199,69,44,.55)">
          <path d="M742 520 c 10 -6 20 0 18 8 c -2 8 -16 10 -22 2 z" />
          <path d="M812 640 c 9 -5 18 0 16 7 c -2 7 -14 9 -20 2 z" />
        </g>
        <g fill="rgba(127,209,217,.4)">
          <path d="M880 560 c 8 -5 16 0 15 6 c -2 7 -13 9 -18 2 z" />
        </g>
      </g>

      <!-- 两条岸线 + 岸上的手刻感知细节 -->
      <path d="M895 -20 C 915 130, 826 270, 796 410 C 766 550, 682 672, 642 812 C 626 862, 610 898, 600 920" fill="none" stroke="rgba(216,243,246,.5)" stroke-width="1.8" />
      <path d="M985 -20 C 1020 140, 946 288, 924 436 C 902 584, 830 712, 800 852 C 788 890, 776 908, 768 920" fill="none" stroke="rgba(216,243,246,.42)" stroke-width="1.8" />
      <!-- 岸线外侧的短刻线（像手绘的晕线） -->
      <g stroke="rgba(127,209,217,.28)" stroke-width="1.2" stroke-linecap="round">
        <path d="M866 40 l-16 -6" /><path d="M846 130 l-17 -5" /><path d="M820 226 l-17 -4" /><path d="M790 322 l-18 -3" />
        <path d="M756 420 l-18 -2" /><path d="M716 520 l-18 -1" /><path d="M676 616 l-18 0" /><path d="M630 716 l-18 2" />
        <path d="M582 812 l-18 4" /><path d="M976 60 l17 -6" /><path d="M968 156 l18 -5" /><path d="M950 254 l18 -4" />
        <path d="M930 350 l18 -3" /><path d="M920 450 l18 -2" /><path d="M930 548 l18 -1" /><path d="M952 646 l18 1" />
        <path d="M976 744 l18 3" /><path d="M998 840 l18 5" />
      </g>
      <!-- 右岸：小树剪影（左岸的芦苇与木桩曾落在水面上，已删） -->
      <g fill="#03131a" opacity=".92">
        <path d="M1044 250 l14 -34 l14 34 z" /><path d="M1048 250 h20 v6 h-20 z" />
        <path d="M1104 384 l12 -28 l12 28 z" /><path d="M1108 384 h16 v5 h-16 z" />
        <path d="M1010 704 l16 -40 l16 40 z" /><path d="M1014 704 h24 v7 h-24 z" />
      </g>
      <!-- 河上的一只小舟（远景，佐证"河在被人用"） -->
      <g transform="translate(878 226) rotate(-8)" opacity=".8">
        <path d="M-26 0 C -12 10, 12 10, 26 0 C 16 14, -16 14, -26 0 Z" fill="#03131a" />
        <path d="M0 -16 L 0 2" stroke="#03131a" stroke-width="2" />
        <path d="M0 -16 L 16 -6 L 0 -2 Z" fill="rgba(243,249,250,.5)" />
      </g>

      <rect width="1440" height="900" fill="url(#fade)" />
      <rect width="1440" height="900" fill="url(#vig)" />
    </svg>

    <!-- ── 覆盖层 ── -->
    <div class="ov" style="left:76px; top:96px; width:560px">
      <div class="cat">MDB—0001 · 河道观测手记</div>
      <h1 style="margin-top:14px">暖流河道</h1>
      <p class="sub">河只有一条。瓶子顺水往下，一次只在一个人的手里 ——<br />谁捞到，谁就接下一句。</p>
    </div>

    <!-- 手写旁注：故意歪着放、故意不跟标题对齐 -->
    <div class="note ov" style="left:96px; top:352px; width:250px; transform:rotate(-2.4deg)">
      <b>① 捞取</b><br />河里漂着别人的半句歌。点一下，它顺水到你手上。
    </div>
    <div class="note ov" style="left:120px; top:530px; width:250px; transform:rotate(1.8deg)">
      <b>② 投下</b><br />你录一段，封进瓶子，放进上游 —— 交给下一个陌生人。
    </div>
    <!-- 手绘标识：只留一条短引导线（长箭头会变成乱线；红笔圈太随意，已删） -->
    <svg class="ov" style="left:0; top:0" width="1440" height="900" viewBox="0 0 1440 900">
      <path d="M352 372 C 430 388, 500 452, 556 520" fill="none" stroke="rgba(243,249,250,.42)" stroke-width="1.6" />
      <path d="M548 508 L 562 524 L 542 522" fill="none" stroke="rgba(243,249,250,.55)" stroke-width="1.6" stroke-linecap="round" />
    </svg>

    <!-- 圆形主按钮：捞（下游，近处）/ 投（上游，远处），等大等权 -->
    <div class="port draw ov" style="left:640px; top:504px; width:144px; height:144px" role="button" aria-label="捞一个漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="top:calc(100% + 76px)"><b>捞一个漂流瓶</b>捞到即持有：同一时刻，同一条河道上只有你拿着它。</span>
    </div>
    <div class="port cast ov" style="left:928px; top:248px; width:144px; height:144px" role="button" aria-label="投下一支漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="top:calc(100% + 16px)"><b>投下一支漂流瓶</b>选一首歌，录下第 1 段，然后放进上游等一个陌生人接下一棒。</span>
    </div>

    <!-- 手记的落款：印 + 编号 -->
    <div class="ov" style="right:76px; top:150px; text-align:right">
      <div class="cat" style="letter-spacing:.18em">观测者 · layoutmui6k36v</div>
      <div class="cat" style="margin-top:6px; letter-spacing:.18em">河道只能随机打捞，没有搜索</div>
      <svg width="74" height="74" viewBox="0 0 74 74" style="margin-top:16px; transform:rotate(6deg)">
        <circle cx="37" cy="37" r="34" fill="none" stroke="rgba(199,69,44,.85)" stroke-width="2.4" />
        <path d="M16 32c6-7 12-7 18 0s12 7 18 0" fill="none" stroke="rgba(199,69,44,.9)" stroke-width="3" stroke-linecap="round" />
        <path d="M16 44c6-7 12-7 18 0s12 7 18 0" fill="none" stroke="rgba(199,69,44,.9)" stroke-width="3" stroke-linecap="round" />
      </svg>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
