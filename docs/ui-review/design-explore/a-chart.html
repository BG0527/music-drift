<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>A · 海图 Ocean Chart</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');

      :root {
        --paper: #eef3f3;
        --paper-2: #e5eded;
        --ink: #08262e;
        --ink-2: #4b6b74;
        --rule: #a5bfc5;
        --rule-2: #cfdee0;
        --teal: #0f6d80;
        --coral: #c7452c;
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; }
      body {
        background: var(--paper);
        color: var(--ink);
        font-family: 'LXGW WenKai', serif;
        display: flex;
        -webkit-font-smoothing: antialiased;
      }
      .num { font-family: Quattrocento, serif; font-feature-settings: 'tnum'; }

      /* ── 侧栏：纸上的目录，只有发丝线 ── */
      .rail { width: 208px; border-right: 1px solid var(--rule); padding: 28px 20px; display: flex; flex-direction: column; gap: 36px; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .04em; }
      .brand svg { display: block; }
      .nav { display: flex; flex-direction: column; }
      .nav a { display: flex; align-items: baseline; gap: 10px; height: 44px; color: var(--ink-2); text-decoration: none; font-size: 15px; }
      .nav a .tick { width: 14px; height: 1px; background: var(--rule-2); transform: translateY(-4px); }
      .nav a[aria-current] { color: var(--ink); font-weight: 700; }
      .nav a[aria-current] .tick { background: var(--coral); width: 22px; }
      .me { margin-top: auto; border-top: 1px solid var(--rule-2); padding-top: 14px; font-size: 13px; color: var(--ink-2); }
      .me b { display: block; color: var(--ink); font-size: 14px; font-weight: 700; }

      /* ── 主区：一张海图，双线边框 + 角标 ── */
      .sheet { flex: 1; padding: 26px 34px 22px; }
      .frame { position: relative; height: 100%; border: 1px solid var(--rule); background: var(--paper); }
      .frame::after { content: ''; position: absolute; inset: 5px; border: 1px solid var(--rule-2); pointer-events: none; }
      .frame > .inner { position: absolute; inset: 6px; padding: 22px 26px 20px; display: flex; flex-direction: column; }

      .head { display: flex; align-items: flex-end; justify-content: space-between; padding-bottom: 12px; border-bottom: 1px solid var(--rule-2); }
      .head h1 { font-size: 54px; font-weight: 700; line-height: 1.05; letter-spacing: .01em; }
      .head p { margin-top: 6px; font-size: 15px; color: var(--ink-2); }
      .quiet { font-size: 14px; color: var(--teal); text-decoration: underline; text-underline-offset: 3px; }

      /* ── 图面 ── */
      .chart { position: relative; flex: 1; margin-top: 10px; }
      .chart svg.base { position: absolute; inset: 0; width: 100%; height: 100%; }

      .station { position: absolute; transform: translateX(-50%); text-align: center; }
      .rings { position: relative; width: 244px; height: 244px; margin: 0 auto; display: grid; place-items: center; }
      .rings i { position: absolute; border-radius: 50%; }
      .rings i.r1 { inset: 0; border: 1px dashed var(--rule); }
      .rings i.r2 { inset: 38px; border: 1px dashed var(--rule); }
      .rings i.r3 { inset: 74px; border: 1px solid var(--rule); }
      .rings i.r4 { inset: 74px; border: 1px solid var(--rule-2); animation: ping 4s ease-out infinite; }
      @keyframes ping { 0% { transform: scale(1); opacity: .9 } 100% { transform: scale(1.9); opacity: 0 } }
      .port {
        position: relative; z-index: 2; width: 96px; height: 96px; border-radius: 50%;
        display: grid; place-items: center; gap: 2px; cursor: pointer;
        font-family: inherit; font-size: 14px; font-weight: 700; letter-spacing: .06em;
      }
      .port.draw { background: var(--teal); color: #fff; border: 0; box-shadow: 0 0 0 6px var(--paper); }
      .port.cast { background: var(--coral); color: #fff; border: 0; box-shadow: 0 0 0 6px var(--paper); }
      .port span { display: block; font-size: 11px; opacity: .85; letter-spacing: .16em; }
      .pnote { width: 300px; margin: 14px auto 0; text-align: left; }
      .pnote b { display: block; font-size: 17px; font-weight: 700; margin-bottom: 4px; }
      .pnote p { font-size: 13px; line-height: 1.7; color: var(--ink-2); }
      .leader { width: 1px; height: 16px; background: var(--rule); margin: 0 auto; }

      .legend { display: flex; align-items: center; gap: 10px; padding-top: 12px; border-top: 1px solid var(--rule-2); }
      .tag { border: 1px solid var(--rule); padding: 6px 12px; font-size: 13px; color: var(--ink-2); }
      .tag[aria-pressed='true'] { border-color: var(--ink); color: var(--ink); font-weight: 700; }
      .legend .hint { margin-left: auto; font-size: 12px; color: var(--ink-2); }
    </style>
  </head>
  <body>
    <aside class="rail">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f6d80" stroke-width="2" stroke-linecap="round">
          <path d="M2 9c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" />
          <path d="M2 16c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" />
        </svg>
        音乐漂流瓶
      </div>
      <nav class="nav">
        <a href="#" aria-current="page"><span class="tick"></span>河道</a>
        <a href="#"><span class="tick"></span>公海</a>
        <a href="#"><span class="tick"></span>我的</a>
        <a href="#"><span class="tick"></span>设置</a>
      </nav>
      <div class="me"><b>layoutmui6k36v</b>普通用户</div>
    </aside>

    <main class="sheet">
      <div class="frame">
        <div class="inner">
          <header class="head">
            <div>
              <h1>暖流河道</h1>
              <p>拾起那些搁浅在黑夜里的声线</p>
            </div>
            <a class="quiet" href="#">我参与过的漂流瓶</a>
          </header>

          <div class="chart">
            <svg class="base" viewBox="0 0 1120 470" preserveAspectRatio="none">
              <defs>
                <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
                  <path d="M40 0H0V40" fill="none" stroke="#cfdee0" stroke-width="1" />
                </pattern>
              </defs>
              <rect width="1120" height="470" fill="url(#grid)" opacity=".55" />

              <!-- 等深刻度：数字用 Quattrocento（图表惯例） -->
              <g stroke="#a5bfc5" stroke-width="1">
                <line x1="26" y1="60" x2="26" y2="300" />
                <line x1="26" y1="60" x2="40" y2="60" />
                <line x1="26" y1="120" x2="36" y2="120" />
                <line x1="26" y1="180" x2="40" y2="180" />
                <line x1="26" y1="240" x2="36" y2="240" />
                <line x1="26" y1="300" x2="40" y2="300" />
              </g>
              <g fill="#4b6b74" font-family="Quattrocento, serif" font-size="13">
                <text x="46" y="64">12</text>
                <text x="42" y="184">24</text>
                <text x="46" y="304">38</text>
              </g>
              <text x="26" y="330" fill="#4b6b74" font-family="LXGW WenKai, serif" font-size="12">水深（米）</text>

              <!-- 五线谱 × 等深线：音乐与水的同一条曲线 -->
              <g stroke="#cfdee0" stroke-width="1">
                <line x1="120" y1="150" x2="1120" y2="150" />
                <line x1="120" y1="176" x2="1120" y2="176" />
                <line x1="120" y1="202" x2="1120" y2="202" />
                <line x1="120" y1="228" x2="1120" y2="228" />
              </g>
              <path
                d="M120 189 C 200 189, 240 150, 320 152 C 400 154, 440 226, 520 224 C 600 222, 640 132, 720 138 C 800 144, 840 232, 920 226 C 1000 220, 1060 194, 1120 190"
                fill="none" stroke="#0f6d80" stroke-width="2" stroke-linecap="round"
              />
              <g fill="#c7452c">
                <circle cx="320" cy="152" r="3.4" />
                <circle cx="520" cy="224" r="3.4" />
                <circle cx="720" cy="138" r="3.4" />
                <circle cx="920" cy="226" r="3.4" />
              </g>
              <text x="120" y="34" fill="#4b6b74" font-family="LXGW WenKai, serif" font-size="12">
                河道主流 · 一条声线在四个段位之间起伏
              </text>

              <!-- 岸线 + 晕线 -->
              <path d="M1042 0 C 1020 90, 1064 180, 1040 270 C 1022 340, 1058 410, 1044 470" fill="none" stroke="#a5bfc5" stroke-width="1.4" />
              <g stroke="#a5bfc5" stroke-width="1" opacity=".8">
                <line x1="1050" y1="20" x2="1070" y2="8" /><line x1="1052" y1="60" x2="1078" y2="44" />
                <line x1="1054" y1="100" x2="1084" y2="80" /><line x1="1056" y1="140" x2="1090" y2="116" />
                <line x1="1052" y1="186" x2="1092" y2="158" /><line x1="1048" y1="230" x2="1088" y2="204" />
                <line x1="1044" y1="276" x2="1080" y2="254" /><line x1="1042" y1="320" x2="1076" y2="302" />
                <line x1="1044" y1="366" x2="1078" y2="350" /><line x1="1046" y1="410" x2="1084" y2="394" />
              </g>
              <text x="1052" y="452" fill="#4b6b74" font-family="LXGW WenKai, serif" font-size="12">岸</text>

              <!-- 罗盘 -->
              <g transform="translate(70 400)">
                <circle r="30" fill="none" stroke="#a5bfc5" />
                <circle r="22" fill="none" stroke="#cfdee0" />
                <path d="M0 -30 L5 0 L0 30 L-5 0 Z" fill="#08262e" />
                <path d="M-30 0 L0 -5 L30 0 L0 5 Z" fill="#a5bfc5" />
                <text x="-4" y="-34" fill="#4b6b74" font-family="Quattrocento, serif" font-size="11">N</text>
              </g>
            </svg>

            <div class="station" style="left: 316px; top: 52px">
              <div class="rings">
                <i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4"></i>
                <button class="port draw">捞取<span>DRAW</span></button>
              </div>
              <div class="leader"></div>
              <div class="pnote">
                <b>捞一个漂流瓶</b>
                <p>捞取深海深处传来的匿名哼唱，接续她的下一句旋律。捞到即持有：同一时刻，同一条河道上只有你拿着它。</p>
              </div>
            </div>

            <div class="station" style="left: 840px; top: 52px">
              <div class="rings">
                <i class="r1"></i><i class="r2"></i><i class="r3"></i><i class="r4" style="animation-delay: 1.2s"></i>
                <button class="port cast">投下<span>CAST</span></button>
              </div>
              <div class="leader"></div>
              <div class="pnote">
                <b>投下一支漂流瓶</b>
                <p>选一首歌，录下第 1 段（时长以该段为准），然后投进河道等一个陌生人接下一棒。</p>
              </div>
            </div>
          </div>

          <div class="legend">
            <button class="tag" aria-pressed="true">全部</button>
            <button class="tag">深夜</button>
            <button class="tag">通勤</button>
            <button class="tag">告白</button>
            <button class="tag">雨天</button>
            <span class="hint">河道只能随机打捞，没有搜索，也不能指定某个人来接。心情标签这一版只作展示。</span>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
