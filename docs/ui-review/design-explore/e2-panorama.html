<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>C2 · 河道长卷 Night River Panorama</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');

      :root { --void: #061a22; --paper: #f3f9fa; --muted: #a9c7cf; --line: rgba(243,249,250,.14);
        --teal: #0f6d80; --glass: #7fd1d9; --coral: #c7452c; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; }
      body { position: relative; overflow: hidden;
        background: linear-gradient(180deg, #082731 0%, #04141a 52%, #021014 100%);
        color: var(--paper); font-family: 'LXGW WenKai', serif; -webkit-font-smoothing: antialiased; }

      header.bar { position: absolute; left: 0; right: 0; top: 0; height: 62px; display: flex; align-items: center;
        gap: 36px; padding: 0 44px; border-bottom: 1px solid var(--line); z-index: 4; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
      .bar nav { display: flex; gap: 28px; margin-left: auto; }
      .bar nav a { color: var(--muted); text-decoration: none; font-size: 14px; letter-spacing: .06em; }
      .bar nav a[aria-current] { color: var(--paper); border-bottom: 1px solid var(--glass); padding-bottom: 3px; }

      .hero { position: absolute; left: 48px; top: 100px; width: 520px; z-index: 3; }
      .hero h1 { font-size: 74px; font-weight: 700; line-height: 1; }
      .hero p { margin-top: 14px; font-size: 15.5px; line-height: 1.85; color: var(--muted); }

      .acts { position: absolute; right: 48px; top: 112px; width: 660px; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; z-index: 3; }
      .act { display: flex; flex-direction: column; gap: 9px; }
      .act b { font-size: 12.5px; letter-spacing: .12em; color: var(--glass); font-weight: 400; }
      .act.cast b { color: #e8a08c; }
      .act button { height: 56px; border: 0; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 700;
        letter-spacing: .08em; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
      .act.draw button { background: var(--teal); }
      .act.cast button { background: var(--coral); }
      .act p { font-size: 12.5px; line-height: 1.7; color: var(--muted); }

      /* ── 长卷：一条向观者流来的河，河上漂着四只瓶 ── */
      .scroll { position: absolute; left: 0; right: 0; bottom: 0; height: 580px; z-index: 1; }
      .scroll > svg { position: absolute; inset: 0; width: 100%; height: 100%; }
      .blur { filter: blur(7px); }
      .mist { filter: blur(16px); }

      .mark { position: absolute; display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: rgba(243,249,250,.82);
        text-shadow: 0 1px 6px rgba(2,16,20,.95); letter-spacing: .06em; z-index: 2; }
      .mark i { width: 22px; height: 1px; background: rgba(243,249,250,.5); display: block; }
      .mark.hot { color: var(--glass); }
      .mark.hot i { background: var(--glass); }

      footer { position: absolute; left: 48px; right: 48px; bottom: 26px; display: flex; align-items: center; gap: 10px; z-index: 4; }
      .tag { background: rgba(4,20,26,.5); border: 1px solid var(--line); color: var(--muted); font-family: inherit;
        font-size: 12px; padding: 8px 15px; cursor: pointer; letter-spacing: .1em; backdrop-filter: blur(3px); }
      .tag[aria-pressed='true'] { border-color: rgba(127,209,217,.6); color: var(--paper); }
      footer .go { margin-left: auto; font-size: 13px; color: var(--glass); text-decoration: none; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7fd1d9" stroke-width="2" stroke-linecap="round">
          <path d="M2 9c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" /><path d="M2 16c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" />
        </svg>
        音乐漂流瓶
      </div>
      <nav><a href="#" aria-current="page">河道</a><a href="#">公海</a><a href="#">我的</a><a href="#">设置</a></nav>
    </header>

    <div class="hero">
      <h1>暖流河道</h1>
      <p>河只有一条，瓶子一次只在一个人的手里。<br />你捞到它，就接下一句；接完再决定它往哪漂。</p>
    </div>

    <div class="acts">
      <div class="act draw">
        <b>下游 · 接住漂来的</b>
        <button>捞一个漂流瓶</button>
        <p>捞取深海深处传来的匿名哼唱，接续她的下一句旋律。捞到即持有：同一时刻，同一条河道上只有你拿着它。</p>
      </div>
      <div class="act cast">
        <b>上游 · 放进河里</b>
        <button>投下一支漂流瓶</button>
        <p>选一首歌，录下第 1 段（时长以该段为准），然后投进河道等一个陌生人接下一棒。</p>
      </div>
    </div>

    <div class="scroll">
      <svg viewBox="0 0 1440 580" preserveAspectRatio="none">
        <defs>
          <symbol id="bottle" viewBox="0 0 220 360">
            <defs>
              <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#d8f3f6" stop-opacity=".3" />
                <stop offset=".4" stop-color="#2a9db1" stop-opacity=".18" />
                <stop offset=".76" stop-color="#0b4e5b" stop-opacity=".46" />
                <stop offset="1" stop-color="#7fd1d9" stop-opacity=".34" />
              </linearGradient>
              <linearGradient id="bs1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7fd1d9" stop-opacity=".55" />
                <stop offset="1" stop-color="#0f6d80" stop-opacity=".32" />
              </linearGradient>
              <clipPath id="bc1">
                <path d="M80 56 H140 V96 C 140 118, 178 138, 178 168 V300 C 178 318, 164 330, 146 330 H74 C 56 330, 42 318, 42 300 V168 C 42 138, 80 118, 80 96 Z" />
              </clipPath>
            </defs>
            <g clip-path="url(#bc1)">
              <rect x="30" y="238" width="170" height="110" fill="url(#bs1)" />
              <g transform="rotate(-14 118 264)">
                <rect x="94" y="240" width="52" height="44" rx="7" fill="#efe6d2" opacity=".9" />
                <path d="M101 250 h38 M101 259 h38 M101 268 h24" stroke="#b9a888" stroke-width="2" stroke-linecap="round" />
              </g>
            </g>
            <path d="M80 56 H140 V96 C 140 118, 178 138, 178 168 V300 C 178 318, 164 330, 146 330 H74 C 56 330, 42 318, 42 300 V168 C 42 138, 80 118, 80 96 Z"
              fill="url(#bg1)" stroke="rgba(216,243,246,.85)" stroke-width="2.4" stroke-linejoin="round" />
            <path d="M60 176 C 56 220, 56 270, 60 306" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6" stroke-linecap="round" />
            <rect x="74" y="44" width="72" height="16" rx="7" fill="rgba(216,243,246,.22)" stroke="rgba(216,243,246,.7)" stroke-width="2" />
            <rect x="86" y="24" width="48" height="24" rx="7" fill="#c7452c" />
            <rect x="86" y="24" width="48" height="9" rx="4" fill="#9d4125" />
          </symbol>
          <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#57c6d6" stop-opacity=".5" />
            <stop offset=".34" stop-color="#1a8698" stop-opacity=".44" />
            <stop offset="1" stop-color="#04191f" stop-opacity=".92" />
          </linearGradient>
          <radialGradient id="moonglow" cx=".5" cy=".5" r=".5">
            <stop offset="0" stop-color="#fdf6e8" stop-opacity=".85" />
            <stop offset=".42" stop-color="#cfe9ee" stop-opacity=".18" />
            <stop offset="1" stop-color="#cfe9ee" stop-opacity="0" />
          </radialGradient>
          <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#fdf6e8" stop-opacity=".55" />
            <stop offset="1" stop-color="#fdf6e8" stop-opacity="0" />
          </linearGradient>
          <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7fd1d9" stop-opacity=".55" />
            <stop offset="1" stop-color="#7fd1d9" stop-opacity=".06" />
          </linearGradient>
          <clipPath id="riverClip">
            <path d="M600 210 C 596 282, 470 342, 372 414 C 274 486, 168 540, 66 580 L1400 580 C 1300 540, 1196 492, 1096 416 C 1006 346, 902 288, 880 210 Z" />
          </clipPath>
        </defs>

        <!-- 月与雾 -->
        <circle cx="1092" cy="92" r="176" fill="url(#moonglow)" />
        <circle cx="1092" cy="92" r="40" fill="#f7f2e4" />
        <circle cx="1079" cy="83" r="6.5" fill="#e6ddc8" opacity=".65" />
        <ellipse class="mist" cx="740" cy="238" rx="350" ry="30" fill="rgba(207,233,238,.16)" />
        <ellipse class="mist" cx="742" cy="212" rx="230" ry="22" fill="rgba(207,233,238,.2)" />
        <ellipse class="mist" cx="1180" cy="286" rx="240" ry="20" fill="rgba(207,233,238,.09)" />

        <!-- 河：一条自远而近、单支的水道（不是梯形 —— 两条岸线各自蜿蜒） -->
        <path d="M600 210 C 596 282, 470 342, 372 414 C 274 486, 168 540, 66 580 L1400 580 C 1300 540, 1196 492, 1096 416 C 1006 346, 902 288, 880 210 Z"
          fill="url(#water)" />
        <g clip-path="url(#riverClip)">
          <!-- 水面横向波纹：近大远小 -->
          <g stroke="rgba(216,243,246,.26)" fill="none" stroke-width="1.5">
            <path d="M612 240 C 700 234, 800 244, 872 238" />
            <path d="M576 286 C 680 274, 820 292, 918 278" />
            <path d="M528 344 C 660 328, 840 352, 976 330" />
            <path d="M462 412 C 630 390, 860 420, 1030 392" />
            <path d="M356 494 C 560 468, 880 504, 1130 468" />
          </g>
          <!-- 月光在水面拉出的一条光路 -->
          <path d="M1040 210 C 1052 310, 1070 430, 1102 580 L 966 580 C 950 450, 958 310, 952 210 Z" fill="url(#streak)" opacity=".22" />
          <!-- 近处更深的水 -->
          <ellipse cx="700" cy="560" rx="620" ry="120" fill="rgba(2,16,20,.45)" />
        </g>
        <!-- 两条岸线的高光边 -->
        <path d="M600 210 C 596 282, 470 342, 372 414 C 274 486, 168 540, 66 580" fill="none" stroke="url(#edge)" stroke-width="1.6" />
        <path d="M880 210 C 902 288, 1006 346, 1096 416 C 1196 492, 1300 540, 1400 580" fill="none" stroke="url(#edge)" stroke-width="1.6" />

        <!-- 远岸（模糊的岸线，把河夹住） -->
        <path class="blur" d="M0 214 C 150 200, 300 218, 470 208 C 520 205, 570 208, 600 210 L600 236 C 480 232, 300 246, 0 240 Z" fill="#03151b" opacity=".9" />
        <path class="blur" d="M880 210 C 940 206, 1080 200, 1240 208 C 1330 213, 1400 216, 1440 214 L1440 244 C 1300 248, 1080 240, 880 236 Z" fill="#03151b" opacity=".9" />

        <!-- 近岸芦苇剪影 -->
        <g stroke="#02141a" stroke-width="3.4" stroke-linecap="round" opacity=".95">
          <path d="M52 452 C 46 492, 42 528, 40 566" /><path d="M86 442 C 82 484, 78 522, 76 560" />
          <path d="M1390 436 C 1396 478, 1400 516, 1402 556" /><path d="M1352 446 C 1358 486, 1362 522, 1364 560" />
        </g>

        <!-- 四只瓶：越远越小，都在水里 -->
        <use href="#bottle" x="708" y="240" width="36" height="59" />
        <use href="#bottle" x="694" y="300" width="46" height="75" />
        <use href="#bottle" x="680" y="366" width="60" height="98" />
        <use href="#bottle" x="662" y="440" width="78" height="128" />
      </svg>

      <div class="mark hot" style="left: 756px; top: 244px"><i></i>第 1 段 · 待录</div>
      <div class="mark" style="left: 752px; top: 306px"><i></i>第 2 段 · 空位</div>
      <div class="mark" style="left: 752px; top: 374px"><i></i>第 3 段 · 空位</div>
      <div class="mark" style="left: 752px; top: 450px"><i></i>第 4 段 · 空位</div>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
