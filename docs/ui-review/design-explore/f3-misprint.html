<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F3 · 错版河道 Off-register Print</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#071e27; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }
      svg.canvas { position:absolute; inset:0; width:1440px; height:900px; }
      .ov { position:absolute; }
      h1 { font-size:92px; font-weight:700; line-height:.98; }
      .sub { margin-top:16px; font-size:15.5px; line-height:1.9; color:var(--muted); max-width:430px; }
      .spec { font-family:ui-monospace,Consolas,monospace; font-size:11px; letter-spacing:.08em; color:rgba(169,199,207,.7); line-height:2; }
      .bignum { font-family:Quattrocento,serif; font-size:34px; color:var(--glass); font-weight:400; }
      .lbl { font-size:11.5px; letter-spacing:.14em; color:var(--muted); }

      .port { position:absolute; display:grid; place-items:center; cursor:pointer; }
      .port i { position:absolute; border-radius:50%; }
      /* 两圈刻意错位的环 —— 与整页的"错版"是同一个语言 */
      .port .plate { inset:0; border:2px solid rgba(127,209,217,.75); transform:translate(-7px,-6px); }
      .port .plate2 { inset:0; border:2px solid rgba(199,69,44,.7); transform:translate(6px,7px); }
      .port .plate3 { inset:18px; border:1px solid rgba(243,249,250,.5); }
      .port .core { position:relative; width:92px; height:92px; border-radius:50%; display:grid; place-items:center; gap:2px;
        font-family:inherit; font-size:15px; font-weight:700; letter-spacing:.14em; color:#fff; }
      .port .core span { font-size:9px; letter-spacing:.26em; opacity:.75; font-weight:400; }
      .draw .core { background:linear-gradient(180deg,#12798d,#0b4e5b); }
      .cast .core { background:linear-gradient(180deg,#d2502f,#9d4125); }
      .port .cap { position:absolute; width:270px; font-size:12.5px; line-height:1.75; color:var(--muted);
        text-shadow:0 1px 8px rgba(3,20,26,.95); }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:4px; }
      .spec { text-shadow:0 1px 8px rgba(3,20,26,.95); }

      footer { position:absolute; left:64px; right:64px; bottom:28px; display:flex; align-items:center; gap:10px; z-index:5; }
      .tag { background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px;
        padding:8px 15px; cursor:pointer; letter-spacing:.1em; }
      .tag[aria-pressed='true'] { border-color:rgba(127,209,217,.6); color:var(--paper); }
      footer .go { margin-left:auto; font-size:13px; color:var(--glass); text-decoration:none; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <svg class="canvas" viewBox="0 0 1440 900">
      <defs>
        <linearGradient id="water" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#0b3a4a" stop-opacity=".8" />
          <stop offset=".45" stop-color="#2a9db1" stop-opacity=".5" />
          <stop offset="1" stop-color="#0b3a4a" stop-opacity=".8" />
        </linearGradient>
        <pattern id="dots" width="9" height="9" patternUnits="userSpaceOnUse">
          <circle cx="2.2" cy="2.2" r="1.5" fill="rgba(243,249,250,.5)" />
        </pattern>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <clipPath id="bandClip">
          <path d="M1480 120 C 1250 160, 1110 212, 930 292 C 750 372, 610 432, 430 522 C 290 592, 110 652, -40 712 L-40 892 C 110 832, 290 772, 430 702 C 610 612, 750 552, 930 472 C 1110 392, 1250 340, 1480 300 Z" />
        </clipPath>
      </defs>

      <rect width="1440" height="900" fill="#071e27" />
      <!-- 纸纹与折痕 -->
      <rect width="1440" height="900" filter="url(#grain)" opacity=".12" />
      <path d="M998 0 L 1006 900" stroke="rgba(243,249,250,.05)" stroke-width="26" />

      <!-- ── 三块印版：同一形状、三种油墨、各自错开（这就是"错版"） ── -->
      <g>
        <!-- 奶白版（底的形状） -->
        <path d="M1480 120 C 1250 160, 1110 212, 930 292 C 750 372, 610 432, 430 522 C 290 592, 110 652, -40 712 L-40 892 C 110 832, 290 772, 430 702 C 610 612, 750 552, 930 472 C 1110 392, 1250 340, 1480 300 Z"
          fill="rgba(243,249,250,.07)" />
        <!-- 青版：向左上错开 -->
        <path d="M1480 120 C 1250 160, 1110 212, 930 292 C 750 372, 610 432, 430 522 C 290 592, 110 652, -40 712 L-40 892 C 110 832, 290 772, 430 702 C 610 612, 750 552, 930 472 C 1110 392, 1250 340, 1480 300 Z"
          fill="none" stroke="rgba(127,209,217,.85)" stroke-width="2.6" transform="translate(-10 -8)" />
        <!-- 珊瑚版：向右下错开 -->
        <path d="M1480 120 C 1250 160, 1110 212, 930 292 C 750 372, 610 432, 430 522 C 290 592, 110 652, -40 712 L-40 892 C 110 832, 290 772, 430 702 C 610 612, 750 552, 930 472 C 1110 392, 1250 340, 1480 300 Z"
          fill="none" stroke="rgba(199,69,44,.8)" stroke-width="2.6" transform="translate(9 11)" />
        <!-- 水（在形状内） -->
        <path d="M1480 120 C 1250 160, 1110 212, 930 292 C 750 372, 610 432, 430 522 C 290 592, 110 652, -40 712 L-40 892 C 110 832, 290 772, 430 702 C 610 612, 750 552, 930 472 C 1110 392, 1250 340, 1480 300 Z"
          fill="url(#water)" />
      </g>

      <g clip-path="url(#bandClip)">
        <!-- 网点（印刷的另一种"皮肤"） -->
        <rect x="-60" y="80" width="1560" height="240" fill="url(#dots)" opacity=".22" transform="translate(0 40)" />
        <!-- 顺流的漂移虚线 -->
        <g fill="none" stroke="rgba(243,249,250,.5)" stroke-width="2.4" stroke-linecap="round" stroke-dasharray="20 30">
          <path d="M1500 208 C 1250 250, 1110 302, 930 382 C 750 462, 610 522, 430 612 C 290 682, 110 742, -60 802" />
        </g>
        <g fill="none" stroke="rgba(243,249,250,.24)" stroke-width="2" stroke-linecap="round" stroke-dasharray="12 40">
          <path d="M1500 282 C 1250 324, 1110 376, 930 456 C 750 536, 610 596, 430 686 C 290 756, 110 816, -60 876" />
        </g>
        <!-- 水面反光碎点 -->
        <g fill="rgba(240,252,254,.55)">
          <circle cx="1180" cy="290" r="2.2" /><circle cx="1320" cy="244" r="1.7" /><circle cx="1060" cy="352" r="2" />
          <circle cx="920" cy="418" r="1.8" /><circle cx="800" cy="486" r="2.3" /><circle cx="660" cy="556" r="1.7" />
          <circle cx="520" cy="630" r="2.1" /><circle cx="380" cy="700" r="1.8" /><circle cx="230" cy="770" r="2.2" />
        </g>
      </g>

      <!-- 套准标记 + 色标：印刷厂里才有的东西，放在这里既点题又当装饰 -->
      <g transform="translate(1348 806)">
        <circle r="26" fill="none" stroke="rgba(243,249,250,.35)" stroke-width="1.2" />
        <path d="M-34 0 H34 M0 -34 V34" stroke="rgba(243,249,250,.35)" stroke-width="1.2" />
        <circle r="9" fill="none" stroke="rgba(127,209,217,.6)" stroke-width="1.2" />
      </g>
      <g transform="translate(1000 800)">
        <rect width="34" height="14" fill="#7fd1d9" opacity=".85" />
        <rect x="38" width="34" height="14" fill="#c7452c" opacity=".85" />
        <rect x="76" width="34" height="14" fill="#f3f9fa" opacity=".7" />
        <rect x="114" width="34" height="14" fill="#0f6d80" opacity=".9" />
        <text x="0" y="34" fill="rgba(169,199,207,.7)" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">套准 · 青 12% 珊瑚 8% 偏移</text>
      </g>
    </svg>

    <!-- ── 覆盖层：紧排的排版块，与松散的印版形成对照 ── -->
    <div class="ov" style="left:76px; top:104px; width:520px">
      <div class="lbl" style="letter-spacing:.22em; color:rgba(169,199,207,.8)">河道 · 第一版</div>
      <h1 style="margin-top:12px">暖流河道</h1>
      <p class="sub">河只有一条，瓶子一次只在一个人的手里。你捞到它，就接下一句。</p>
    </div>

    <div class="ov" style="left:76px; top:392px; width:300px">
      <div class="lbl">河道中待接棒</div>
      <div class="bignum">03</div>
      <div class="lbl" style="margin-top:14px">上一棒</div>
      <div class="bignum">2h</div>
    </div>

    <div class="ov" style="left:960px; top:512px; width:330px">
      <div class="spec">
        河宽随流而下渐开<br />
        单支路 · 同时只一人持有<br />
        上游在右 · 下游在左
      </div>
    </div>

    <!-- 两块印版对应的两个圆的按钮：等大等权 -->
    <div class="port draw ov" style="left:472px; top:596px; width:132px; height:132px" role="button" aria-label="捞一个漂流瓶">
      <i class="plate"></i><i class="plate2"></i><i class="plate3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="left:150px; top:6px"><b>捞一个漂流瓶</b>捞取深水里传来的匿名哼唱。捞到即持有：同一时刻，同一条河道上只有你拿着它。</span>
    </div>
    <div class="port cast ov" style="left:1004px; top:196px; width:132px; height:132px" role="button" aria-label="投下一支漂流瓶">
      <i class="plate"></i><i class="plate2"></i><i class="plate3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="right:150px; top:22px; text-align:right"><b>投下一支漂流瓶</b>选一首歌，录下第 1 段，放进上游等一个陌生人接下一棒。</span>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
