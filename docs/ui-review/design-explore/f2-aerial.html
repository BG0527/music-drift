<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F2 · 夜色航拍 Night Aerial</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#04141a; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }
      svg.canvas { position:absolute; inset:0; width:1440px; height:900px; }
      .ov { position:absolute; }
      h1 { font-size:74px; font-weight:700; line-height:1; }
      .sub { margin-top:14px; font-size:15.5px; line-height:1.9; color:var(--muted); }
      .meta { display:flex; gap:26px; margin-top:20px; }
      .meta div { font-size:11.5px; color:var(--muted); letter-spacing:.1em; }
      .meta b { display:block; margin-top:5px; font-family:Quattrocento,serif; font-size:22px; font-weight:400; color:var(--glass); letter-spacing:0; }

      .port { position:absolute; display:grid; place-items:center; cursor:pointer; }
      .port i { position:absolute; border-radius:50%; }
      .port .r1 { inset:0; border:1px solid rgba(127,209,217,.4); }
      .port .r2 { inset:20px; border:1px solid rgba(127,209,217,.5); }
      .port .r3 { inset:40px; border:1px solid rgba(240,252,254,.6); }
      .port .core { position:relative; width:88px; height:88px; border-radius:50%; display:grid; place-items:center; gap:2px;
        font-family:inherit; font-size:14px; font-weight:700; letter-spacing:.14em; color:#fff; }
      .port .core span { font-size:9px; letter-spacing:.26em; opacity:.75; font-weight:400; }
      .draw .core { background:linear-gradient(180deg,#12798d,#0b4e5b); box-shadow:0 0 0 6px rgba(4,20,26,.7), 0 0 40px rgba(42,157,177,.55); }
      .cast .core { background:linear-gradient(180deg,#d2502f,#9d4125); box-shadow:0 0 0 6px rgba(4,20,26,.7), 0 0 40px rgba(199,69,44,.5); }
      .port .cap { position:absolute; width:280px; font-size:12.5px; line-height:1.7; color:var(--muted); }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:3px; }

      footer { position:absolute; left:64px; right:64px; bottom:28px; display:flex; align-items:center; gap:10px; z-index:5; }
      .tag { background:rgba(4,20,26,.5); border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px;
        padding:8px 15px; cursor:pointer; letter-spacing:.1em; }
      .tag[aria-pressed='true'] { border-color:rgba(127,209,217,.6); color:var(--paper); }
      footer .go { margin-left:auto; font-size:13px; color:var(--glass); text-decoration:none; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <svg class="canvas" viewBox="0 0 1440 900">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#07242e" />
          <stop offset=".45" stop-color="#051a22" />
          <stop offset="1" stop-color="#021014" />
        </linearGradient>
        <linearGradient id="band" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#57c6d6" stop-opacity=".42" />
          <stop offset=".3" stop-color="#1a8698" stop-opacity=".38" />
          <stop offset=".72" stop-color="#0b3a4a" stop-opacity=".5" />
          <stop offset="1" stop-color="#03161d" stop-opacity=".9" />
        </linearGradient>
        <linearGradient id="streak" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fdf6e8" stop-opacity=".5" />
          <stop offset="1" stop-color="#fdf6e8" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="halo" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#eafcff" stop-opacity=".55" />
          <stop offset="1" stop-color="#eafcff" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="moonglow" cx=".5" cy=".5" r=".5">
          <stop offset="0" stop-color="#fdf6e8" stop-opacity=".75" />
          <stop offset=".34" stop-color="#cfe9ee" stop-opacity=".14" />
          <stop offset="1" stop-color="#cfe9ee" stop-opacity="0" />
        </radialGradient>
        <filter id="soft"><feGaussianBlur stdDeviation="9" /></filter>
        <filter id="grain">
          <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" />
          <feColorMatrix type="saturate" values="0" />
        </filter>
        <clipPath id="bandClip">
          <path d="M-20 430 C 240 400, 460 470, 720 500 C 980 530, 1180 560, 1460 600 L1460 870 L-20 870 Z" />
        </clipPath>
      </defs>

      <rect width="1440" height="900" fill="url(#sky)" />

      <!-- 星与月 -->
      <g fill="#eafcff">
        <circle cx="180" cy="90" r="1.5" opacity=".7" /><circle cx="330" cy="52" r="1.1" opacity=".5" />
        <circle cx="470" cy="128" r="1.7" opacity=".6" /><circle cx="620" cy="70" r="1.2" opacity=".45" />
        <circle cx="760" cy="140" r="1.4" opacity=".55" /><circle cx="1120" cy="60" r="1.3" opacity=".5" />
        <circle cx="1250" cy="150" r="1.6" opacity=".6" /><circle cx="1360" cy="96" r="1.1" opacity=".4" />
        <circle cx="90" cy="220" r="1.2" opacity=".4" /><circle cx="980" cy="40" r="1.5" opacity=".55" />
      </g>
      <circle cx="1108" cy="196" r="300" fill="url(#moonglow)" />
      <circle cx="1108" cy="196" r="62" fill="#f9f4e6" />
      <circle cx="1086" cy="184" r="10" fill="#e7dfca" opacity=".55" />
      <circle cx="1130" cy="216" r="7" fill="#e7dfca" opacity=".4" />
      <!-- 薄云 -->
      <ellipse cx="420" cy="250" rx="280" ry="16" fill="rgba(207,233,238,.09)" filter="url(#soft)" />
      <ellipse cx="1180" cy="330" rx="240" ry="13" fill="rgba(207,233,238,.07)" filter="url(#soft)" />

      <!-- 远岸的树线 -->
      <path d="M-20 388 C 120 372, 260 396, 420 384 C 560 373, 700 396, 860 386 C 1020 376, 1180 398, 1460 382 L1460 424 L-20 424 Z"
        fill="#03151b" opacity=".95" />
      <g fill="#03151b">
        <path d="M232 388 l16 -40 l16 40 z" /><path d="M300 392 l13 -32 l13 32 z" />
        <path d="M1268 386 l18 -44 l18 44 z" /><path d="M1344 390 l14 -34 l14 34 z" />
      </g>

      <!-- 河：一条横贯画面的斜向水道 -->
      <path d="M-20 430 C 240 400, 460 470, 720 500 C 980 530, 1180 560, 1460 600 L1460 870 L-20 870 Z" fill="url(#band)" />

      <g clip-path="url(#bandClip)">
        <!-- 月光在水面拉出的光路 -->
        <path d="M1060 430 C 1078 520, 1104 640, 1140 880 L 986 880 C 968 660, 972 520, 980 430 Z" fill="url(#streak)" opacity=".26" />
        <!-- 水面的波纹（顺流，近大远小） -->
        <g fill="none" stroke="rgba(216,243,246,.24)" stroke-width="1.5">
          <path d="M-20 452 C 240 424, 470 492, 730 522 C 990 552, 1190 580, 1460 620" />
          <path d="M-20 490 C 250 460, 480 528, 740 560 C 1000 592, 1200 618, 1460 658" />
          <path d="M-20 540 C 260 508, 490 578, 750 610 C 1010 642, 1210 668, 1460 708" />
          <path d="M-20 600 C 270 566, 500 638, 760 670 C 1020 702, 1220 728, 1460 768" />
          <path d="M-20 668 C 280 632, 510 706, 770 738 C 1030 770, 1230 796, 1460 836" />
        </g>
        <!-- 漂移虚线（水在流） -->
        <g fill="none" stroke="rgba(243,249,250,.4)" stroke-width="2.2" stroke-linecap="round" stroke-dasharray="22 34">
          <path d="M-20 512 C 250 482, 480 552, 740 584 C 1000 616, 1200 642, 1460 682" />
        </g>
        <!-- 生物发光的碎点 -->
        <g fill="#eafcff">
          <circle cx="180" cy="520" r="2.4" opacity=".7" /><circle cx="320" cy="572" r="1.8" opacity=".5" />
          <circle cx="430" cy="498" r="2.1" opacity=".6" /><circle cx="560" cy="620" r="2.6" opacity=".75" />
          <circle cx="700" cy="556" r="1.9" opacity=".55" /><circle cx="820" cy="660" r="2.3" opacity=".65" />
          <circle cx="940" cy="592" r="2" opacity=".6" /><circle cx="1060" cy="700" r="2.5" opacity=".7" />
          <circle cx="1180" cy="640" r="1.8" opacity=".5" /><circle cx="1290" cy="742" r="2.2" opacity=".62" />
          <circle cx="120" cy="620" r="1.9" opacity=".5" /><circle cx="380" cy="656" r="2.2" opacity=".6" />
          <circle cx="640" cy="742" r="2" opacity=".55" /><circle cx="900" cy="782" r="2.4" opacity=".62" />
        </g>
        <!-- 水下礁石与沙洲 -->
        <ellipse cx="620" cy="700" rx="90" ry="26" fill="rgba(2,14,18,.55)" />
        <ellipse cx="620" cy="692" rx="66" ry="17" fill="rgba(127,209,217,.18)" />
        <ellipse cx="1210" cy="800" rx="120" ry="30" fill="rgba(207,233,238,.13)" />
        <ellipse cx="240" cy="640" rx="70" ry="20" fill="rgba(2,14,18,.45)" />
        <!-- 一只亮着灯的小船 -->
        <g transform="translate(1330 726) rotate(-6)">
          <path d="M-30 0 C -14 12, 14 12, 30 0 C 18 16, -18 16, -30 0 Z" fill="#02141a" />
          <path d="M0 -20 L 0 2" stroke="#02141a" stroke-width="2.4" />
          <path d="M0 -20 L 20 -8 L 0 -3 Z" fill="rgba(243,249,250,.45)" />
          <circle cx="0" cy="-6" r="4" fill="#c7452c" opacity=".95" />
          <circle cx="0" cy="-6" r="12" fill="url(#halo)" />
        </g>
      </g>

      <!-- 岸：芦苇 / 木栈桥 -->
      <path d="M-20 430 C 240 400, 460 470, 720 500 C 980 530, 1180 560, 1460 600" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.6" />
      <path d="M-20 870 C 280 830, 520 806, 780 790 C 1040 774, 1240 766, 1460 758" fill="none" stroke="rgba(216,243,246,.22)" stroke-width="1.4" />
      <g stroke="#02141a" stroke-width="3.6" stroke-linecap="round" opacity=".95">
        <path d="M120 470 C 112 502, 106 530, 102 558" /><path d="M158 462 C 152 494, 146 522, 142 550" />
        <path d="M214 476 C 208 508, 202 536, 198 564" /><path d="M1348 640 C 1356 672, 1362 700, 1366 728" />
        <path d="M1392 648 C 1400 680, 1406 708, 1410 736" />
      </g>
      <g opacity=".9">
        <rect x="252" y="446" width="120" height="8" rx="3" fill="#02141a" />
        <rect x="262" y="452" width="7" height="46" fill="#02141a" /><rect x="306" y="452" width="7" height="52" />
        <rect x="350" y="452" width="7" height="46" />
      </g>
      <ellipse cx="700" cy="470" rx="360" ry="20" fill="rgba(207,233,238,.08)" filter="url(#soft)" />
      <rect width="1440" height="900" filter="url(#grain)" opacity=".1" />
    </svg>

    <!-- ── 覆盖层 ── -->
    <div class="ov" style="left:64px; top:92px; width:520px">
      <h1>暖流河道</h1>
      <p class="sub">夜里的河只有一条。瓶子顺水往下，一次只在一个人的手里。</p>
      <div class="meta">
        <div>河道中待接棒<b>03</b></div>
        <div>上一棒<b>2h</b></div>
        <div>水面<b>静</b></div>
      </div>
    </div>

    <!-- 两个泊位：骑在河面上，等大等权 -->
    <div class="port draw ov" style="left:388px; top:520px; width:136px; height:136px" role="button" aria-label="捞一个漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="right:156px; top:34px; text-align:right">
        <b>捞一个漂流瓶</b>捞取深水里传来的匿名哼唱，接续她的下一句。捞到即持有。
      </span>
    </div>
    <div class="port cast ov" style="left:984px; top:612px; width:136px; height:136px" role="button" aria-label="投下一支漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="left:156px; top:20px">
        <b>投下一支漂流瓶</b>选一首歌，录下第 1 段，放进上游等一个陌生人接下一棒。
      </span>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
