<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>C3 · 俯视河道 River from Above</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');

      :root { --void: #05171e; --paper: #f3f9fa; --muted: #a9c7cf; --line: rgba(243,249,250,.14);
        --teal: #0f6d80; --glass: #7fd1d9; --coral: #c7452c; }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; }
      body { position: relative; overflow: hidden;
        background: radial-gradient(90% 70% at 78% 62%, #0c3641 0%, #05171e 58%, #021014 100%);
        color: var(--paper); font-family: 'LXGW WenKai', serif; -webkit-font-smoothing: antialiased; }

      header.bar { position: absolute; left: 0; right: 0; top: 0; height: 62px; display: flex; align-items: center;
        gap: 36px; padding: 0 44px; border-bottom: 1px solid var(--line); z-index: 4; }
      .brand { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 700; letter-spacing: .06em; }
      .bar nav { display: flex; gap: 28px; margin-left: auto; }
      .bar nav a { color: var(--muted); text-decoration: none; font-size: 14px; letter-spacing: .06em; }
      .bar nav a[aria-current] { color: var(--paper); border-bottom: 1px solid var(--glass); padding-bottom: 3px; }

      /* ── 左侧编辑栏：标题在上、两个泊位竖排等权 ── */
      .side { position: absolute; left: 48px; top: 104px; width: 386px; z-index: 3; display: flex; flex-direction: column; gap: 22px; }
      .side h1 { font-size: 62px; font-weight: 700; line-height: 1.02; }
      .side .sub { font-size: 15px; line-height: 1.85; color: var(--muted); }
      .side .rule { height: 1px; background: var(--line); }
      .act { display: flex; flex-direction: column; gap: 8px; }
      .act b { font-size: 12.5px; letter-spacing: .12em; font-weight: 400; color: var(--glass); }
      .act.cast b { color: #e8a08c; }
      .act button { height: 58px; border: 0; cursor: pointer; font-family: inherit; font-size: 17px; font-weight: 700;
        letter-spacing: .08em; color: #fff; display: flex; align-items: center; justify-content: center; gap: 10px; }
      .act.draw button { background: var(--teal); }
      .act.cast button { background: var(--coral); }
      .act p { font-size: 12.5px; line-height: 1.7; color: var(--muted); }
      .meter { display: flex; gap: 4px; }
      .meter i { width: 22px; height: 3px; background: rgba(243,249,250,.16); display: block; }
      .meter i.on { background: var(--glass); }

      /* 圆形主按钮（用户第 ① 条：保留圆形 + 同心环），骑在河道上 */
      /* 泊位：照搬 g3 的按钮（深色半透圆盘 + 亮边 + 外环），盘身不填彩色 —— 用户："有颜色太丑了" */
      .port { position:absolute; display:grid; place-items:center; cursor:pointer; z-index:3; }
      .port i { position:absolute; border-radius:50%; pointer-events:none; }
      .port .r1 { inset:-13px; border:1.5px solid rgba(228,249,252,.42); }
      .port .r2 { inset:-29px; border:1px solid rgba(228,249,252,.2); }
      .port .r3 { inset:-45px; border:1px solid rgba(228,249,252,.1); }
      .port .core { position:relative; width:100%; height:100%; border-radius:50%; display:grid; place-items:center; gap:3px;
        font-family:inherit; font-size:20px; font-weight:700; letter-spacing:.12em; color:#f3f9fa;
        background:radial-gradient(76% 76% at 34% 26%, rgba(10,48,60,.5), rgba(3,17,23,.78));
        text-shadow:0 1px 12px rgba(3,16,22,.95); }
      .port .core span { font-size:10px; letter-spacing:.28em; opacity:.7; font-weight:400; }
      .draw .core { border:1px solid rgba(203,238,246,.7); box-shadow:0 0 52px rgba(178,232,244,.3), inset 0 0 28px rgba(160,226,240,.2); }
      .cast .core { border:1px solid rgba(246,215,154,.66); box-shadow:0 0 52px rgba(246,215,154,.26), inset 0 0 28px rgba(246,215,154,.16); }
      .port .cap { position:absolute; width:290px; font-size:12.5px; line-height:1.75; color:var(--muted);
        text-shadow:0 1px 8px rgba(3,20,26,.95); }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:3px; }

      /* ── 右侧：从上方看下去的一条河道 ── */
      .field { position: absolute; right: 0; top: 62px; width: 1010px; height: 838px; z-index: 1; }
      .field > svg { position: absolute; inset: 0; width: 100%; height: 100%; }

      .wp { position: absolute; width: 240px; display: flex; align-items: center; justify-content: flex-end; gap: 9px;
        font-size: 12.5px; color: rgba(243,249,250,.78); text-shadow: 0 1px 6px rgba(2,16,20,.95);
        letter-spacing: .06em; z-index: 2; }
      .wp i { width: 7px; height: 7px; border-radius: 50%; background: rgba(243,249,250,.6); display: block; flex: none; }
      .wp.hot { color: var(--glass); }
      .wp.hot i { background: var(--glass); box-shadow: 0 0 10px rgba(127,209,217,.9); }

      footer { position: absolute; left: 48px; right: 48px; bottom: 26px; display: flex; align-items: center; gap: 10px; z-index: 4; }
      .tag { background: rgba(4,20,26,.5); border: 1px solid var(--line); color: var(--muted); font-family: inherit;
        font-size: 12px; padding: 8px 15px; cursor: pointer; letter-spacing: .1em; backdrop-filter: blur(3px); }
      .tag[aria-pressed='true'] { border-color: rgba(127,209,217,.6); color: var(--paper); }
      footer .go { margin-left: auto; font-size: 13px; color: var(--glass); text-decoration: none; letter-spacing: .06em; }
    </style>
  </head>
  <body>
    <header class="bar">
      <div class="brand">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7fd1d9" stroke-width="2" stroke-linecap="round">
          <path d="M2 9c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" /><path d="M2 16c2.5-3 5-3 7.5 0s5 3 7.5 0 4.5-2.5 5 0" />
        </svg>
        音乐漂流瓶
      </div>
      <nav><a href="#" aria-current="page">河道</a><a href="#">公海</a><a href="#">我的</a><a href="#">设置</a></nav>
    </header>

    <div class="field">
      <svg viewBox="0 0 1010 838" preserveAspectRatio="none">
        <defs>
          <symbol id="bottle" viewBox="0 0 220 360">
            <defs>
              <linearGradient id="bg1" x1="0" y1="0" x2="1" y2="0">
                <stop offset="0" stop-color="#d8f3f6" stop-opacity=".32" />
                <stop offset=".4" stop-color="#2a9db1" stop-opacity=".2" />
                <stop offset=".76" stop-color="#0b4e5b" stop-opacity=".48" />
                <stop offset="1" stop-color="#7fd1d9" stop-opacity=".36" />
              </linearGradient>
              <linearGradient id="bs1" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#7fd1d9" stop-opacity=".55" />
                <stop offset="1" stop-color="#0f6d80" stop-opacity=".32" />
              </linearGradient>
              <clipPath id="bc1">
                <path d="M80 56 H140 V96 C 140 118, 178 138, 178 168 V300 C 178 318, 164 330, 146 330 H74 C 56 330, 42 318, 42 300 V168 C 42 138, 80 118, 80 96 Z" />
              </clipPath>
            </defs>
            <g clip-path="url(#bc1)">
              <rect x="30" y="238" width="170" height="110" fill="url(#bs1)" />
              <g transform="rotate(-14 118 264)">
                <rect x="94" y="240" width="52" height="44" rx="7" fill="#efe6d2" opacity=".9" />
                <path d="M101 250 h38 M101 259 h38 M101 268 h24" stroke="#b9a888" stroke-width="2" stroke-linecap="round" />
              </g>
            </g>
            <path d="M80 56 H140 V96 C 140 118, 178 138, 178 168 V300 C 178 318, 164 330, 146 330 H74 C 56 330, 42 318, 42 300 V168 C 42 138, 80 118, 80 96 Z"
              fill="url(#bg1)" stroke="rgba(216,243,246,.85)" stroke-width="2.4" stroke-linejoin="round" />
            <path d="M60 176 C 56 220, 56 270, 60 306" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="6" stroke-linecap="round" />
            <rect x="74" y="44" width="72" height="16" rx="7" fill="rgba(216,243,246,.22)" stroke="rgba(216,243,246,.7)" stroke-width="2" />
            <rect x="86" y="24" width="48" height="24" rx="7" fill="#c7452c" />
            <rect x="86" y="24" width="48" height="9" rx="4" fill="#9d4125" />
          </symbol>
          <linearGradient id="chan" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#5fd0e0" stop-opacity=".5" />
            <stop offset=".5" stop-color="#1a8698" stop-opacity=".34" />
            <stop offset="1" stop-color="#0b3a4a" stop-opacity=".3" />
          </linearGradient>
          <clipPath id="fieldClip"><rect width="1010" height="838" /></clipPath>
        </defs>

        <g clip-path="url(#fieldClip)">
          <!-- 水面等深线：一圈圈的细线，让"这是一片水"不用解释 -->
          <g fill="none" stroke="rgba(127,209,217,.13)" stroke-width="1">
            <path d="M-20 90 C 200 70, 420 110, 640 90 C 820 74, 940 100, 1030 88" />
            <path d="M-20 190 C 210 168, 430 212, 650 190 C 830 172, 950 200, 1030 186" />
            <path d="M-20 300 C 220 276, 440 322, 660 300 C 840 282, 960 310, 1030 296" />
            <path d="M-20 420 C 230 394, 450 442, 670 420 C 850 402, 970 430, 1030 416" />
            <path d="M-20 550 C 240 524, 460 572, 680 550 C 860 532, 980 560, 1030 546" />
            <path d="M-20 680 C 250 654, 470 702, 690 680 C 870 662, 990 690, 1030 676" />
            <path d="M-20 800 C 260 776, 480 822, 700 800 C 880 782, 1000 810, 1030 796" />
          </g>

          <!-- 河道：一条从右上流向左下的水带（单支路 —— 只有这一条） -->
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="rgba(127,209,217,.1)" stroke-width="150" stroke-linecap="round" />
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="url(#chan)" stroke-width="118" stroke-linecap="round" />
          <!-- 两条岸线 -->
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="rgba(216,243,246,.5)" stroke-width="1.4" stroke-dasharray="0" transform="translate(0 -59)" opacity=".7" />
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" transform="translate(0 59)" opacity=".6" />
          <!-- 水面上的流向虚线 -->
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="rgba(243,249,250,.56)" stroke-width="2.2" stroke-dasharray="16 22" stroke-linecap="round" />
          <path d="M1060 20 C 900 130, 860 250, 742 300 C 620 352, 552 388, 452 470 C 352 552, 292 640, 40 900"
            fill="none" stroke="rgba(243,249,250,.34)" stroke-width="2" stroke-dasharray="12 28" stroke-linecap="round" transform="translate(0 -30)" />

          <!-- 默认态：河道里没有瓶子，只有水在流（用户第 ④ 条） -->
        </g>
      
      <!-- ── 细节层（**删掉这个 g 就回到上一版**）——
           从 g3 借来的四种"感觉"，按河道主题落地：上浮水泡 / 打着旋的音符 / 水面涟漪 / 远处鱼群 -->
      <defs>
        <!-- 八分音符：**内联 SVG**，刻意不用 ♪ 字符（U+266A 落在仓库禁 emoji 的码点区间里） -->
        <g id="note8">
          <ellipse cx="0" cy="0" rx="7.5" ry="5.6" transform="rotate(-20)" fill="#eafcff" />
          <rect x="6" y="-30" width="1.6" height="30" fill="#eafcff" />
          <path d="M7.6 -30 C 16 -26, 20 -20, 19 -11 C 17 -19, 13 -22, 7.6 -23 Z" fill="#eafcff" />
        </g>
        <g id="fish1">
          <path d="M0 0 C 8 -6, 20 -6, 28 0 C 20 6, 8 6, 0 0 Z" />
          <path d="M0 0 L -9 -7 L -9 7 Z" />
        </g>
      </defs>
      <g id="detail">
        <!-- 上浮的水泡：越靠下越大（贴近镜头） -->
        <g fill="none" stroke="#eafcff">
          <circle cx="120" cy="640" r="6" stroke-width="1" opacity=".3" /><circle cx="188" cy="700" r="9" stroke-width="1.2" opacity=".26" />
          <circle cx="268" cy="596" r="4.5" stroke-width="1" opacity=".3" /><circle cx="360" cy="742" r="13" stroke-width="1.4" opacity=".2" />
          <circle cx="470" cy="660" r="7" stroke-width="1.1" opacity=".28" /><circle cx="590" cy="770" r="17" stroke-width="1.6" opacity=".16" />
          <circle cx="700" cy="600" r="5.5" stroke-width="1" opacity=".3" /><circle cx="820" cy="726" r="11" stroke-width="1.3" opacity=".2" />
          <circle cx="940" cy="650" r="8" stroke-width="1.1" opacity=".26" /><circle cx="1080" cy="790" r="21" stroke-width="1.8" opacity=".13" />
          <circle cx="1240" cy="620" r="6.5" stroke-width="1" opacity=".28" /><circle cx="1380" cy="740" r="15" stroke-width="1.5" opacity=".17" />
        </g>
        <g fill="#eafcff">
          <circle cx="186" cy="697" r="2" opacity=".3" /><circle cx="700" cy="598" r="1.6" opacity=".3" />
          <circle cx="940" cy="647" r="2.2" opacity=".26" /><circle cx="1240" cy="618" r="1.8" opacity=".28" />
        </g>
        <!-- 打着旋的音符（内联 SVG，不是字符） -->
        <use href="#note8" transform="translate(300 300) scale(1.1) rotate(-14)" opacity=".34" />
        <use href="#note8" transform="translate(520 470) scale(.8) rotate(11)" opacity=".26" />
        <use href="#note8" transform="translate(760 620) scale(1.25) rotate(-6)" opacity=".3" />
        <use href="#note8" transform="translate(1080 470) scale(.95) rotate(17)" opacity=".24" />
        <use href="#note8" transform="translate(1300 690) scale(1.05) rotate(-9)" opacity=".2" />
        <!-- 远处的水面涟漪（g3 左上那圈波纹 → 河道上的对应物） -->
        <g fill="none" stroke="#cfe9ee">
          <ellipse cx="150" cy="150" rx="52" ry="17" stroke-width="1" opacity=".17" />
          <ellipse cx="150" cy="150" rx="78" ry="26" stroke-width="1" opacity=".11" />
          <ellipse cx="150" cy="150" rx="106" ry="35" stroke-width="1" opacity=".14" />
          <ellipse cx="150" cy="150" rx="136" ry="45" stroke-width="1" opacity=".08" />
          <ellipse cx="228" cy="196" rx="42" ry="14" stroke-width="1" opacity=".12" />
        </g>
        <!-- 河里远处的鱼群：极淡，只给"隐约有一群"的观感 -->
        <g fill="#02141a" opacity=".42">
          <use href="#fish1" transform="translate(470 402) scale(.9) rotate(-26)" />
          <use href="#fish1" transform="translate(528 428) scale(1.1) rotate(-22)" />
          <use href="#fish1" transform="translate(432 436) scale(.75) rotate(-30)" />
          <use href="#fish1" transform="translate(576 404) scale(.85) rotate(-24)" />
          <use href="#fish1" transform="translate(494 460) scale(.65) rotate(-28)" />
          <use href="#fish1" transform="translate(612 448) scale(1) rotate(-20)" opacity=".8" />
        </g>
      </g>
</svg>

      <!-- 河道上不放任何段号/段位标记（用户第 ② 条） -->
    </div>

    <div class="side">
      <h1>暖流河道</h1>
      <p class="sub">河只有一条。瓶子顺水往下，一次只在一个人手里 —— 谁捞到，谁就接下一句。</p>
      <div class="rule"></div>
      <div class="meter"><i class="on"></i><i></i><i></i><i></i></div>
    </div>

    <div class="port draw ov" style="left:56px; top:528px; width:264px; height:264px" role="button" aria-label="捞一个漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="left:318px; top:96px; width:280px"><b>捞一个漂流瓶</b>捞取深水里传来的匿名哼唱，接续她的下一句。捞到即持有：同一时刻，同一条河道上只有你拿着它。</span>
    </div>
    <div class="port cast ov" style="left:440px; top:230px; width:212px; height:212px" role="button" aria-label="投下一支漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="left:256px; top:74px; width:280px"><b>投下一支漂流瓶</b>选一首歌，录下第 1 段（时长以该段为准），然后放进上游等一个陌生人接下一棒。</span>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
