<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F0 · 捞与投 三段分镜</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      :root { --ink:#061c25; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { background:var(--ink); color:var(--paper); font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased;
        padding:44px 76px; }
      h1 { font-size:34px; font-weight:700; }
      .lead { margin-top:10px; font-size:13.5px; line-height:1.9; color:var(--muted); }
      .code { font-family:ui-monospace,Consolas,monospace; font-size:11px; color:rgba(169,199,207,.75); }

      .row { margin-top:30px; }
      .row > .h { display:flex; align-items:baseline; gap:14px; }
      .row > .h b { font-size:19px; }
      .row > .h span { font-size:12.5px; color:var(--muted); }
      .frames { display:grid; grid-template-columns:repeat(3, 1fr); gap:60px; margin-top:14px; }
      figure { display:flex; flex-direction:column; gap:10px; }
      .frame { position:relative; width:100%; height:186px; border:1px solid var(--line); overflow:hidden;
        background:linear-gradient(180deg, #07242e, #04151c); }
      .frame svg { position:absolute; inset:0; width:100%; height:100%; }
      .idx { position:absolute; left:10px; top:8px; font-family:Quattrocento,serif; font-size:12px; color:rgba(243,249,250,.5); z-index:2; }
      figcaption { font-size:12.5px; line-height:1.75; color:var(--muted); }
      figcaption b { display:block; color:var(--paper); font-size:14px; margin-bottom:3px; }

      .legend { margin-top:26px; display:flex; gap:34px; border-top:1px solid var(--line); padding-top:16px; }
      .legend div { font-size:12px; color:var(--muted); line-height:1.9; }
      .legend b { color:var(--glass); font-weight:400; }
      .arrow { color:rgba(127,209,217,.7); }
    </style>
  </head>
  <body>
    <h1>捞与投 · 三段分镜</h1>
    <p class="lead">
      河道页平时**只有水在流**（没有瓶子）。瓶子只在一次操作里出现，走完它该走的那一小段，然后交给下一个界面。
    </p>

    <div class="row">
      <div class="h"><b>① 捞取</b><span>瓶子顺水而下 → 到河的一半 → 捞起 → 切入接唱页</span></div>
      <div class="frames">
        <figure>
          <div class="frame">
            <span class="idx">01</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <defs>
                <linearGradient id="w1" x1="0" y1="0" x2="0" y2="1">
                  <stop offset="0" stop-color="#2a9db1" stop-opacity=".5" />
                  <stop offset="1" stop-color="#062430" stop-opacity=".9" />
                </linearGradient>
              </defs>
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(243,249,250,.4)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 24">
                <path d="M-10 100 C 90 92, 170 112, 250 106 C 320 101, 370 110, 410 104" />
              </g>
              <g fill="none" stroke="rgba(127,209,217,.5)" stroke-width="1.2">
                <ellipse cx="150" cy="118" rx="26" ry="9" /><ellipse cx="150" cy="118" rx="46" ry="16" opacity=".6" />
                <ellipse cx="300" cy="132" rx="20" ry="7" opacity=".6" />
              </g>
            </svg>
          </div>
          <figcaption><b>只有水在流</b>常驻状态：漂移虚线 + 偶尔扩散的涟漪。画面里没有瓶子。</figcaption>
        </figure>

        <figure>
          <div class="frame">
            <span class="idx">02</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(243,249,250,.4)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 24">
                <path d="M-10 100 C 90 92, 170 112, 250 106 C 320 101, 370 110, 410 104" />
              </g>
              <g transform="translate(196 78) rotate(12)">
                <rect x="-9" y="-24" width="18" height="46" rx="7" fill="rgba(127,209,217,.28)" stroke="rgba(230,250,252,.9)" stroke-width="2" />
                <rect x="-5" y="-31" width="10" height="8" rx="3" fill="#c7452c" />
                <path d="M-9 -2 h18" stroke="#f3f9fa" stroke-width="1.6" opacity=".7" />
              </g>
              <g stroke="rgba(243,249,250,.5)" stroke-width="1.4" stroke-linecap="round">
                <path d="M182 96 l-22 4" /><path d="M212 100 l22 4" />
              </g>
            </svg>
          </div>
          <figcaption><b>顺水而下，到河的一半</b>瓶子从上游漂进来，位移只动 <span class="code">transform</span>。</figcaption>
        </figure>

        <figure>
          <div class="frame">
            <span class="idx">03</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(127,209,217,.75)" stroke-width="1.6">
                <ellipse cx="196" cy="106" rx="18" ry="6" /><ellipse cx="196" cy="106" rx="38" ry="13" opacity=".75" />
                <ellipse cx="196" cy="106" rx="60" ry="21" opacity=".5" /><ellipse cx="196" cy="106" rx="82" ry="29" opacity=".28" />
              </g>
              <g transform="translate(196 44) rotate(6)">
                <rect x="-10" y="-24" width="20" height="48" rx="8" fill="rgba(127,209,217,.34)" stroke="rgba(230,250,252,.95)" stroke-width="2" />
                <rect x="-5" y="-31" width="10" height="8" rx="3" fill="#c7452c" />
              </g>
              <g stroke="rgba(230,250,252,.6)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="4 6">
                <path d="M196 72 L 196 92" />
              </g>
            </svg>
          </div>
          <figcaption><b>一圈涟漪收拢，瓶子被捞起</b>涟漪为 feedback；右侧同时出现文字状态（<span class="code">aria-live</span>），动效不是唯一反馈。</figcaption>
        </figure>
      </div>
    </div>

    <div class="row">
      <div class="h"><b>② 投下</b><span>落在河中央 → 顺河而下 → 切入下一界面</span></div>
      <div class="frames">
        <figure>
          <div class="frame">
            <span class="idx">01</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(243,249,250,.4)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 24">
                <path d="M-10 100 C 90 92, 170 112, 250 106 C 320 101, 370 110, 410 104" />
              </g>
              <g stroke="rgba(199,69,44,.85)" stroke-width="1.6" stroke-linecap="round" stroke-dasharray="4 6">
                <path d="M196 26 L 196 52" />
              </g>
              <circle cx="196" cy="20" r="3" fill="#c7452c" />
            </svg>
          </div>
          <figcaption><b>点击「投下」</b>河面还是那一条河 —— 点击之前不发任何请求，也不预生成瓶子。</figcaption>
        </figure>

        <figure>
          <div class="frame">
            <span class="idx">02</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(127,209,217,.8)" stroke-width="1.5">
                <ellipse cx="196" cy="92" rx="16" ry="6" /><ellipse cx="196" cy="92" rx="34" ry="12" opacity=".7" />
                <ellipse cx="196" cy="92" rx="54" ry="19" opacity=".45" />
              </g>
              <g transform="translate(196 62) rotate(-4)">
                <rect x="-10" y="-22" width="20" height="44" rx="8" fill="rgba(127,209,217,.32)" stroke="rgba(230,250,252,.95)" stroke-width="2" />
                <rect x="-5" y="-29" width="10" height="8" rx="3" fill="#c7452c" />
              </g>
              <g fill="#f3f9fa" opacity=".8">
                <circle cx="176" cy="60" r="1.8" /><circle cx="218" cy="54" r="1.4" /><circle cx="206" cy="70" r="1.2" />
              </g>
            </svg>
          </div>
          <figcaption><b>瓶子落在河中央</b>入水是一圈由外向内的收拢涟漪 —— 这是"我放进去了"的 confirmation。</figcaption>
        </figure>

        <figure>
          <div class="frame">
            <span class="idx">03</span>
            <svg viewBox="0 0 400 186" preserveAspectRatio="none">
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64 L410 200 L-10 200 Z" fill="url(#w1)" />
              <path d="M-10 60 C 80 52, 160 72, 240 66 C 310 61, 360 70, 410 64" fill="none" stroke="rgba(216,243,246,.45)" stroke-width="1.4" />
              <g fill="none" stroke="rgba(243,249,250,.45)" stroke-width="2" stroke-linecap="round" stroke-dasharray="14 24">
                <path d="M-10 100 C 90 92, 170 112, 250 106 C 320 101, 370 110, 410 104" />
              </g>
              <g transform="translate(322 84) rotate(14)">
                <rect x="-8" y="-20" width="16" height="40" rx="6" fill="rgba(127,209,217,.26)" stroke="rgba(230,250,252,.85)" stroke-width="1.8" />
                <rect x="-4" y="-26" width="8" height="7" rx="2.5" fill="#c7452c" />
              </g>
              <g stroke="rgba(243,249,250,.4)" stroke-width="1.4" stroke-linecap="round" stroke-dasharray="5 7" fill="none">
                <path d="M196 88 C 240 84, 272 86, 300 90" />
              </g>
              <text x="30" y="150" fill="rgba(169,199,207,.85)" font-family="ui-monospace, monospace" font-size="10" letter-spacing="1">
                顺河而下 → 下一界面
              </text>
            </svg>
          </div>
          <figcaption><b>顺河而下，离开这一屏</b>退场用 <span class="code">exitDuration</span>（比入场短）；页面切换 300ms。</figcaption>
        </figure>
      </div>
    </div>

    <div class="legend">
      <div>常驻（decoration）<br /><b>漂移虚线</b> · 46s 一个来回 · 只动 transform</div>
      <div>反馈（feedback）<br /><b>收拢涟漪</b> · 2.4s · 只播一次</div>
      <div>降级<br /><b>reduced-motion</b> 下全部静止，只留文字状态</div>
      <div>进出配对<br /><b>入场 480ms / 退场 240ms</b> · 参数全部取自契约 token</div>
    </div>
  </body>
</html>
