<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>G3 · 水底仰视 Look Up From the Bottom</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');

      :root {
        --ink: #eaf7fa;
        --dim: #a9cbd4;
        --dimmer: #7ea6b1;
        --cold: #cbeef6;
        --warm: #f6d79a;
        --hair: rgba(214, 242, 247, 0.16);
      }
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { width: 1440px; height: 900px; }
      html { background: #061b23; }
      body {
        position: relative; overflow: hidden; color: var(--ink);
        font-family: 'LXGW WenKai', serif; -webkit-font-smoothing: antialiased;
        background: radial-gradient(126% 104% at 50% -22%, #8fd2df 0%, #357e91 16%, #1a5063 36%, #0d3140 60%, #081f29 82%, #061a22 100%);
      }
      .scene { position: absolute; inset: 0; width: 1440px; height: 900px; }

      /* 水面折光缓慢漂移 */
      .mesh-a { animation: drift 38s ease-in-out infinite alternate; }
      .mesh-b { animation: drift 52s ease-in-out infinite alternate-reverse; }
      /* 折光要像光：拉亮细丝，别让它变成一张网 */
      .mesh-a { stroke: #ffffff; }
      .mesh-a ellipse, .mesh-a line { opacity: .66; }
      .mesh-b ellipse, .mesh-b line { opacity: .46; }
      @keyframes drift { from { transform: translate3d(-13px, 4px, 0); } to { transform: translate3d(15px, -5px, 0); } }

      /* 向上飘的气泡 */
      .bub { animation: rise 16s linear infinite; }
      @keyframes rise {
        0% { opacity: .95; transform: translateY(0); }
        74% { opacity: .74; transform: translateY(-118px); }
        100% { opacity: 0; transform: translateY(-166px); }
      }
      .note { animation: lift 21s ease-in-out infinite; }
      @keyframes lift {
        0% { opacity: .85; transform: translateY(0); }
        78% { opacity: .5; transform: translateY(-52px); }
        100% { opacity: 0; transform: translateY(-70px); }
      }

      .brand { position: absolute; left: 46px; top: 28px; z-index: 6; display: flex; align-items: center; gap: 11px;
        font-size: 13.5px; letter-spacing: .2em; color: rgba(226, 246, 250, .84);
        text-shadow: 0 2px 16px rgba(4, 20, 27, .95); }
      .brand svg { display: block; }

      /* 两个等权圆形泊位，骑在天光带上 */
      .orb { position: absolute; width: 118px; height: 118px; border-radius: 50%; cursor: pointer; z-index: 5;
        display: flex; align-items: center; justify-content: center; font-family: inherit; color: var(--ink);
        background: radial-gradient(76% 76% at 34% 26%, rgba(10, 48, 60, .46), rgba(3, 17, 23, .74));
        border: 1px solid rgba(228, 249, 252, .58); text-shadow: 0 1px 12px rgba(3, 16, 22, .95);
        transition: transform .35s ease, border-color .35s ease; }
      .orb span.lb { font-size: 21px; font-weight: 700; letter-spacing: .1em; position: relative; z-index: 2; }
      .orb::before, .orb::after { content: ''; position: absolute; border-radius: 50%; pointer-events: none; }
      .orb::before { inset: -13px; border: 1.5px solid rgba(228, 249, 252, .42); }
      .orb::after { inset: -29px; border: 1px solid rgba(228, 249, 252, .2); }
      .orb:hover { transform: scale(1.03); }
      .orb:focus-visible { outline: 2px solid var(--cold); outline-offset: 8px; }
      .orb.cold { border-color: rgba(203, 238, 246, .7); box-shadow: 0 0 52px rgba(178, 232, 244, .34), inset 0 0 28px rgba(160, 226, 240, .22); }
      .orb.warm { border-color: rgba(246, 215, 154, .66); box-shadow: 0 0 52px rgba(246, 215, 154, .3), inset 0 0 28px rgba(246, 215, 154, .18); }
      .orb.cold::before { border-color: rgba(203, 238, 246, .46); }
      .orb.cold::after { border-color: rgba(203, 238, 246, .2); }
      .orb.warm::before { border-color: rgba(246, 215, 154, .44); }
      .orb.warm::after { border-color: rgba(246, 215, 154, .19); }
      /* 光从按钮上滴进深水 */
      .drip { position: absolute; width: 1.5px; z-index: 2; pointer-events: none; border-radius: 2px;
        background: linear-gradient(to bottom, rgba(236, 251, 254, .62), rgba(236, 251, 254, 0)); }

      .head { position: absolute; left: 88px; top: 392px; width: 452px; z-index: 4; }
      .head h1 { font-size: 58px; font-weight: 700; line-height: 1; letter-spacing: .04em;
        text-shadow: 0 3px 28px rgba(4, 20, 27, .88); }
      .head .sub { margin-top: 22px; width: 336px; font-size: 15.5px; line-height: 1.95; color: var(--dim);
        text-shadow: 0 2px 16px rgba(4, 20, 27, .95); }

      /* 两条动作说明：等权并排，顺着天光带的斜势往右下排 */
      .pod { position: absolute; top: 546px; width: 356px; z-index: 4; }
      .pod.a { left: 566px; }
      .pod.b { left: 976px; }
      .pod .tag { display: flex; align-items: center; gap: 10px; }
      .pod .tag i { width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid currentColor; display: block; flex: none; }
      .pod .tag b { font-size: 13.5px; font-weight: 700; letter-spacing: .16em; }
      .pod.cold { color: var(--cold); }
      .pod.warm { color: var(--warm); }
      .pod p { margin-top: 13px; font-size: 12.5px; line-height: 1.95; color: var(--dim);
        text-shadow: 0 2px 16px rgba(4, 20, 27, .95); }

      footer { position: absolute; left: 88px; right: 88px; bottom: 30px; z-index: 6;
        display: flex; align-items: center; gap: 9px; }
      .tab { height: 31px; padding: 0 16px; border-radius: 999px; cursor: pointer; font-family: inherit;
        font-size: 12.5px; letter-spacing: .12em; color: var(--dimmer); background: rgba(6, 28, 37, .5);
        border: 1px solid var(--hair); transition: color .3s ease, border-color .3s ease; }
      .tab[aria-pressed='true'] { color: #062029; background: var(--cold); border-color: var(--cold); font-weight: 700; }
      footer .go { margin-left: auto; font-size: 13px; letter-spacing: .08em; color: var(--cold);
        text-decoration: none; border-bottom: 1px solid rgba(203, 238, 246, .38); padding-bottom: 3px; }
    </style>
  </head>
  <body>
    <svg class="scene" viewBox="0 0 1440 900" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="gBand" gradientUnits="userSpaceOnUse" x1="-60" y1="380" x2="1480" y2="100">
          <stop offset="0" stop-color="#f4feff" stop-opacity=".92" />
          <stop offset=".3" stop-color="#ffffff" stop-opacity=".76" />
          <stop offset=".62" stop-color="#e2f8fb" stop-opacity=".48" />
          <stop offset=".86" stop-color="#c6eaf1" stop-opacity=".28" />
          <stop offset="1" stop-color="#a9dbe6" stop-opacity=".14" />
        </linearGradient>
        <linearGradient id="gShaft" gradientUnits="userSpaceOnUse" x1="0" y1="150" x2="0" y2="760">
          <stop offset="0" stop-color="#e6fafd" stop-opacity=".62" />
          <stop offset=".4" stop-color="#d6f4fa" stop-opacity=".18" />

        <radialGradient id="gMoon" cx="50%" cy="50%" r="50%">

        <filter id="fSoft" x="-34%" y="-70%" width="168%" height="240%"><feGaussianBlur stdDeviation="30" /></filter>

          <feDisplacementMap in="SourceGraphic" in2="u" scale="30" xChannelSelector="R" yChannelSelector="G" />

        <!-- 透过水面看到的岸/月/树：被水波横切 -->

          <feDisplacementMap in="SourceGraphic" in2="r" scale="18" xChannelSelector="R" yChannelSelector="G" />
        </filter>
        <!-- 天光带是被水折出来的光，不是一条路：整条带子跟着波一起扭 -->
        <filter id="fBand" x="-25%" y="-40%" width="150%" height="180%" color-interpolation-filters="sRGB">
          <feTurbulence type="fractalNoise" baseFrequency="0.0038 0.0062" numOctaves="3" seed="17" result="b" />
          <feDisplacementMap in="SourceGraphic" in2="b" scale="26" xChannelSelector="R" yChannelSelector="G" />
        </filter>

        <pattern id="pDust" width="150" height="150" patternUnits="userSpaceOnUse">
          <circle cx="18" cy="24" r="1.15" fill="#eafbfd" opacity=".5" />

          <circle cx="134" cy="140" r=".7" fill="#eafbfd" opacity=".32" />

        <pattern id="pSlice" width="13" height="21" patternUnits="userSpaceOnUse">

        </pattern>

        <mask id="mSurf"><rect x="-80" y="-90" width="1600" height="800" fill="url(#gSurfFade)" /></mask>
        <mask id="mReflect"><rect x="-60" y="-40" width="820" height="430" fill="url(#gReflectFade)" /></mask>
        <clipPath id="clipBand"><path d="M -60 280 C 320 70 900 18 1510 88 L 1510 140 C 900 92 320 200 -60 440 Z" /></clipPath>

        <g id="bub">
          <circle r="10" fill="url(#gBubG)" stroke="rgba(219,245,250,.55)" stroke-width=".95" />
          <path d="M-6.2 -3 A7.6 7.6 0 0 1 -2.4 -6.6" fill="none" stroke="rgba(255,255,255,.86)" stroke-width="1.5" stroke-linecap="round" />

          <path d="M7.9 -29 C17.5 -25 19.4 -15.5 12.6 -7.6 C16.8 -17.6 12.8 -23.4 7.9 -25.2 Z" fill="#e8f9f6" />
        </g>
        <g id="fish">
          <path d="M-8.6 0 C-3.6 -4.4 3.8 -4.4 8.6 0 C3.8 4.4 -3.6 4.4 -8.6 0 Z M8.6 0 L16 -5.6 L16 5.6 Z" />
        </g>
      </defs>

      <!-- ══ 深水底色 + 河床 ══ -->
      <rect x="0" y="700" width="1440" height="200" fill="url(#gBed)" />
      <g fill="#02131b" opacity=".62">
        <path d="M-40 900 L-40 826 C 180 800 372 842 604 820 C 858 796 1064 844 1300 814 L 1480 832 L 1480 900 Z" />
        <ellipse cx="1258" cy="784" rx="128" ry="30" />

      <!-- ══ 透过水面看到的倒影世界（岸 · 月 · 树），被水波切碎 ══ -->

          <path d="M-60 234 C 140 220 340 240 664 224 L 664 320 L -60 320 Z" fill="#1a5265" opacity=".42" />
