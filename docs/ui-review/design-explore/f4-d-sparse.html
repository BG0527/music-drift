<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>F4 · 沟槽河道 Groove River</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#050f14; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --line:rgba(243,249,250,.16); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }

      /* 沟槽：**密度就是唱片的身份证**。44px 一条的稀环会被读成"行星轨道"；
         真实唱片的沟槽是极密纹理，这里压到 5.5px（再叠一层 17px 让它有疏密），于是从"几十条线"变成"一张表面"。 */
      .grooves { position:absolute; inset:0;
        background:
          /* 档位：3.5px 线 × 26px 周期（约 39 环） */
          repeating-radial-gradient(circle at 1420px 960px,
            rgba(216,243,246,.09) 0 3.5px, transparent 3.5px 26px),
          repeating-radial-gradient(circle at 1420px 960px,
            rgba(207,233,238,.028) 0 16px, transparent 16px 60px),
          radial-gradient(circle at 1420px 960px, rgba(127,209,217,.06) 0 26%, transparent 62%);
      }
      /* 黑胶最认得出来的一处：表面被灯扫过的那道反光 */
      .glint { position:absolute; inset:0; mix-blend-mode:screen;
        background:linear-gradient(104deg, transparent 24%, rgba(207,233,238,.07) 39%,
          rgba(240,252,254,.11) 47%, rgba(207,233,238,.05) 55%, transparent 70%);
      }
      svg.canvas { position:absolute; inset:0; width:1440px; height:900px; }
      .ov { position:absolute; }
      h1 { font-size:84px; font-weight:700; line-height:1; }
      .sub { margin-top:14px; font-size:15.5px; line-height:1.9; color:var(--muted); }
      .cat { font-family:Quattrocento,serif; font-size:11px; letter-spacing:.24em; color:rgba(243,249,250,.5); }
      .note { font-size:13px; line-height:1.85; color:rgba(243,249,250,.72); }
      .note b { color:var(--glass); font-weight:400; }
      .rpm { font-family:Quattrocento,serif; font-size:26px; color:var(--glass); }

      /* 泊位：照搬 g3 的按钮（深色半透圆盘 + 亮边 + 外环），盘身不填彩色 —— 用户："有颜色太丑了" */
      .port { position:absolute; display:grid; place-items:center; cursor:pointer; z-index:3; }
      .port i { position:absolute; border-radius:50%; pointer-events:none; }
      .port .r1 { inset:-13px; border:1.5px solid rgba(228,249,252,.42); }
      .port .r2 { inset:-29px; border:1px solid rgba(228,249,252,.2); }
      .port .r3 { inset:-45px; border:1px solid rgba(228,249,252,.1); }
      .port .core { position:relative; width:100%; height:100%; border-radius:50%; display:grid; place-items:center; gap:3px;
        font-family:inherit; font-size:20px; font-weight:700; letter-spacing:.12em; color:#f3f9fa;
        background:radial-gradient(76% 76% at 34% 26%, rgba(10,48,60,.5), rgba(3,17,23,.78));
        text-shadow:0 1px 12px rgba(3,16,22,.95); }
      .port .core span { font-size:10px; letter-spacing:.28em; opacity:.7; font-weight:400; }
      .draw .core { border:1px solid rgba(203,238,246,.7); box-shadow:0 0 52px rgba(178,232,244,.3), inset 0 0 28px rgba(160,226,240,.2); }
      .cast .core { border:1px solid rgba(246,215,154,.66); box-shadow:0 0 52px rgba(246,215,154,.26), inset 0 0 28px rgba(246,215,154,.16); }
      .port .cap { position:absolute; width:290px; font-size:12.5px; line-height:1.75; color:var(--muted);
        text-shadow:0 1px 8px rgba(2,10,14,.95); }
      .port .cap b { display:block; color:var(--paper); font-size:15px; margin-bottom:3px; }

      footer { position:absolute; left:76px; right:76px; bottom:30px; display:flex; align-items:center; gap:10px; z-index:5; }
      .tag { background:transparent; border:1px solid var(--line); color:var(--muted); font-family:inherit; font-size:12px;
        padding:8px 15px; cursor:pointer; letter-spacing:.1em; }
      .tag[aria-pressed='true'] { border-color:rgba(127,209,217,.6); color:var(--paper); }
      footer .go { margin-left:auto; font-size:13px; color:var(--glass); text-decoration:none; letter-spacing:.06em; }
    </style>
  </head>
  <body>
    <div class="grooves"></div>
    <div class="glint"></div>
    <svg class="canvas" viewBox="0 0 1440 900">
      <defs>
        <radialGradient id="sheen" cx=".99" cy="1" r="1">
          <stop offset="0" stop-color="#7fd1d9" stop-opacity=".1" />
          <stop offset=".4" stop-color="#7fd1d9" stop-opacity="0" />
        </radialGradient>
        <radialGradient id="label" cx=".5" cy=".5" r=".5">
          <stop offset=".62" stop-color="#c7452c" stop-opacity=".2" />
          <stop offset="1" stop-color="#c7452c" stop-opacity="0" />
        </radialGradient>
      </defs>

      <rect width="1440" height="900" fill="url(#sheen)" />
      <circle cx="1420" cy="960" r="300" fill="url(#label)" />

      <!-- 唱片中心（在画布外）：只留一条实的圆心环 + 主轴孔的一点暗示 -->
      <circle cx="1420" cy="960" r="262" fill="none" stroke="rgba(199,69,44,.35)" stroke-width="1.6" />

      <!-- 只留**一条外缘**：唱片只有一个边界，其余全是沟槽纹理（再多几圈就变回行星轨道） -->
      <circle cx="1420" cy="960" r="1276" fill="none" stroke="rgba(207,233,238,.2)" stroke-width="2" />

      <!-- ── 河道 = 那条被点亮的沟槽：它不是一条线，而是一条**有宽度的水槽**（两条岸 + 中间的水） ── -->
      <circle cx="1420" cy="960" r="900" fill="none" stroke="rgba(42,157,177,.2)" stroke-width="26" />
      <circle cx="1420" cy="960" r="900" fill="none" stroke="rgba(159,230,237,.42)" stroke-width="7" />
      <circle cx="1420" cy="960" r="887" fill="none" stroke="rgba(216,243,246,.5)" stroke-width="1.4" />
      <circle cx="1420" cy="960" r="913" fill="none" stroke="rgba(216,243,246,.44)" stroke-width="1.4" />
      <!-- 水流：沿槽走的两道漂移虚线（水在流） -->
      <circle cx="1420" cy="960" r="900" fill="none" stroke="rgba(243,249,250,.42)" stroke-width="2"
        stroke-dasharray="16 30" stroke-linecap="round" />
      <circle cx="1420" cy="960" r="906" fill="none" stroke="rgba(243,249,250,.2)" stroke-width="1.6"
        stroke-dasharray="10 40" stroke-linecap="round" />

      <!-- 灰尘与划痕：让这张唱片"被用过" -->
      <g fill="#eafcff">
        <circle cx="300" cy="640" r="1.6" opacity=".35" /><circle cx="520" cy="330" r="1.3" opacity=".3" />
        <circle cx="980" cy="540" r="1.5" opacity=".3" /><circle cx="1240" cy="760" r="1.7" opacity=".32" />
        <circle cx="180" cy="300" r="1.2" opacity=".26" /><circle cx="760" cy="820" r="1.4" opacity=".28" />
      </g>
      <path d="M420 120 l 90 60" stroke="rgba(243,249,250,.08)" stroke-width="1" />
      <path d="M1040 700 l 70 40" stroke="rgba(243,249,250,.07)" stroke-width="1" />

      <!-- 转向：唱片只往一个方向转 —— 河道也只有一条（这就是"单支路"在唱片上的说法） -->
      <g opacity=".8">
        <path d="M1296 700 Q 1366 640 1442 674" fill="none" stroke="rgba(199,69,44,.55)" stroke-width="2" stroke-linecap="round" />
        <path d="M1442 674 l -6 -15 l -15 6" fill="none" stroke="rgba(199,69,44,.55)" stroke-width="2" stroke-linecap="round" />
        <text x="1146" y="712" fill="rgba(199,69,44,.62)" font-family="ui-monospace, Consolas, monospace"
          font-size="10" letter-spacing="1.6">顺槽 · 33⅓</text>
      </g>

      <!-- 唱臂已删：它在右上角读成了一枚火箭，而这里是一张**唱片**（用户裁决） -->
    
      <!-- ── 细节层 2（**删掉这个 g 就回到上一版**）——
           从 g3 借来的四种"感觉"，按唱片主题翻译：尘屑 / 摩尔纹 / 远处尘屑群 / 沟槽调制 -->
      <g id="detail2">
        <!-- 灯下的同心反光：**宽而柔**（16–34px + 模糊）才像唱片；细而硬就又变回行星轨道 -->
        <filter id="fSheen"><feGaussianBlur stdDeviation="11" /></filter>
        <g filter="url(#fSheen)">
          <circle cx="1420" cy="960" r="1150" fill="none" stroke="rgba(207,233,238,.075)" stroke-width="30" />
          <circle cx="1420" cy="960" r="1010" fill="none" stroke="rgba(240,252,254,.06)" stroke-width="18" />
          <circle cx="1420" cy="960" r="800" fill="none" stroke="rgba(207,233,238,.055)" stroke-width="38" />
        </g>
        <!-- 悬浮在光里的尘屑（g3 的"泡泡" → 唱片表面被灯照到的微尘） -->
        <g fill="#eafcff">
          <circle cx="240" cy="180" r="2.4" opacity=".48" /><circle cx="318" cy="244" r="1.6" opacity=".34" />
          <circle cx="186" cy="332" r="2" opacity=".4" /><circle cx="420" cy="150" r="1.4" opacity=".28" />
          <circle cx="560" cy="252" r="2.2" opacity=".42" /><circle cx="662" cy="178" r="1.5" opacity=".3" />
          <circle cx="880" cy="430" r="2.6" opacity=".44" /><circle cx="1012" cy="360" r="1.7" opacity=".32" />
          <circle cx="1160" cy="470" r="2.1" opacity=".38" /><circle cx="1320" cy="420" r="1.5" opacity=".28" />
          <circle cx="760" cy="560" r="2.3" opacity=".4" /><circle cx="420" cy="620" r="1.8" opacity=".32" />
          <circle cx="600" cy="700" r="2" opacity=".34" /><circle cx="980" cy="660" r="1.6" opacity=".26" />
        </g>
        <!-- 摩尔纹：沟槽最密处被灯照出的干涉纹（g3 的"左上波纹" → 唱片上的对应物） -->
        <g fill="none" stroke="#cfe9ee">
          <ellipse cx="176" cy="92" rx="118" ry="110" stroke-width="1" opacity=".16" />
          <ellipse cx="176" cy="92" rx="130" ry="121" stroke-width="1" opacity=".09" />
          <ellipse cx="176" cy="92" rx="142" ry="132" stroke-width="1" opacity=".14" />
          <ellipse cx="176" cy="92" rx="154" ry="143" stroke-width="1" opacity=".08" />
          <ellipse cx="176" cy="92" rx="166" ry="154" stroke-width="1" opacity=".12" />
          <ellipse cx="176" cy="92" rx="178" ry="165" stroke-width="1" opacity=".07" />
        </g>
        <!-- 远处一撮极淡的尘屑群（g3 的"远处鱼群"→ 保留"隐约有一群"，但唱片上没有鱼） -->
        <g fill="#eafcff" opacity=".3">
          <ellipse cx="248" cy="498" rx="6" ry="1.8" transform="rotate(-22 248 498)" />
          <ellipse cx="268" cy="512" rx="5" ry="1.5" transform="rotate(-18 268 512)" />
          <ellipse cx="232" cy="518" rx="4.4" ry="1.4" transform="rotate(-26 232 518)" />
          <ellipse cx="286" cy="492" rx="5.6" ry="1.7" transform="rotate(-20 286 492)" />
          <ellipse cx="256" cy="534" rx="4" ry="1.3" transform="rotate(-24 256 534)" />
          <ellipse cx="300" cy="520" rx="4.8" ry="1.5" transform="rotate(-16 300 520)" />
          <ellipse cx="222" cy="480" rx="4.2" ry="1.3" transform="rotate(-28 222 480)" />
        </g>
        <!-- 沟槽的调制：一段槽壁露出波形（g3 的"音符" → 唱片上的对应物：沟槽本身就是声音） -->
        <g transform="translate(784 324) rotate(-45)">
          <path d="M-86 0 q 10 -15 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0"
            fill="none" stroke="rgba(216,243,246,.46)" stroke-width="1.6" stroke-linecap="round" />
          <path d="M-86 0 q 10 15 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0 t 20 0"
            fill="none" stroke="rgba(127,209,217,.32)" stroke-width="1.2" stroke-linecap="round" />
        </g>
      </g>
</svg>

    <!-- 覆盖层 -->
    <div class="ov" style="left:76px; top:96px; width:520px">
      <div class="cat">MDB—0001 · A 面 · 33⅓</div>
      <h1 style="margin-top:12px">暖流河道</h1>
      <p class="sub">一条沟槽就是一条河。瓶子顺槽往下，谁捞到，谁就接下一句。</p>
    </div>


    <div class="ov" style="left:1150px; top:112px; width:266px; text-align:right">
      <div class="rpm">33⅓</div>
      <div class="cat" style="margin-top:4px">RPM · A 面 · 单支路</div>
      <div class="cat" style="margin-top:14px; letter-spacing:.06em; line-height:2; opacity:.82">
        外圈落入 · 内圈读出<br />一条槽 · 一条河 · 一次只一人持有
      </div>
    </div>

    <!-- 圆形按钮：骑在那条被点亮的沟槽上 -->
    <div class="port draw ov" style="left:60px; top:400px; width:190px; height:190px" role="button" aria-label="捞一个漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">捞取<span>DRAW</span></span>
      <span class="cap" style="left:230px; top:40px; width:240px"><b>捞一个漂流瓶</b>捞到即持有：同一时刻，同一条河道上只有你拿着它。</span>
    </div>
    <div class="port cast ov" style="left:380px; top:580px; width:150px; height:150px" role="button" aria-label="投下一支漂流瓶">
      <i class="r1"></i><i class="r2"></i><i class="r3"></i>
      <span class="core">投下<span>CAST</span></span>
      <span class="cap" style="left:-304px; top:-294px; width:300px"><b>投下一支漂流瓶</b>选一首歌，录下第 1 段，然后放进上游等一个陌生人接下一棒。</span>
    </div>

    <footer>
      <button class="tag" aria-pressed="true">全部</button>
      <button class="tag">深夜</button><button class="tag">通勤</button>
      <button class="tag">告白</button><button class="tag">雨天</button>
      <a class="go" href="#">先去公海听听已经完成的作品</a>
    </footer>
  </body>
</html>
