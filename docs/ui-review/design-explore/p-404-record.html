<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>404 · 划伤跳针（唱片语言）</title>
    <style>
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-regular.css');
      @import url('/node_modules/.pnpm/lxgw-wenkai-webfont@1.7.0/node_modules/lxgw-wenkai-webfont/lxgwwenkai-bold.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/400.css');
      @import url('/node_modules/.pnpm/@fontsource+quattrocento@5.3.0/node_modules/@fontsource/quattrocento/700.css');
      :root { --ink:#050f14; --paper:#f3f9fa; --muted:#a9c7cf; --glass:#7fd1d9; --coral:#c7452c; --warm:#f6d79a; --line:rgba(243,249,250,.13); }
      * { box-sizing:border-box; margin:0; padding:0; }
      html,body { width:1440px; height:900px; }
      html { overflow:hidden; }
      .clip { position:absolute; inset:0; overflow:hidden; }
      body { position:relative; overflow:hidden; background:var(--ink); color:var(--paper);
        font-family:'LXGW WenKai',serif; -webkit-font-smoothing:antialiased; }
      .mono, .cat, .status { font-family:Quattrocento,serif; font-variant-numeric:tabular-nums; }
      .cat { font-size:11px; letter-spacing:.24em; color:rgba(243,249,250,.5); }
      .platter { position:absolute; inset:0;
        background:
          repeating-radial-gradient(circle at 1420px 960px, rgba(216,243,246,.055) 0 1.2px, transparent 1.2px 6.5px),
          radial-gradient(circle at 1420px 960px, rgba(127,209,217,.05) 0 30%, transparent 68%); }
      .glint { position:absolute; inset:0; mix-blend-mode:screen;
        background:linear-gradient(101deg, transparent 28%, rgba(228,247,252,.045) 45%, rgba(228,247,252,.065) 50%, rgba(228,247,252,.028) 55%, transparent 72%); }
      .art { position:absolute; inset:0; }
      /* 划伤之上是唱片表面：密沟槽整片被这一道划伤横切，所以到伤口处整齐断掉 */
      .groove { position:absolute; left:0; right:0; top:0; height:365px;
        background:repeating-radial-gradient(circle at 1500px 1400px, rgba(216,243,246,.1) 0 1px, transparent 1px 15px);
        -webkit-mask-image:radial-gradient(1150px 820px at 1180px 180px, rgba(255,255,255,.95), rgba(255,255,255,.3) 72%);
        mask-image:radial-gradient(1150px 820px at 1180px 180px, rgba(255,255,255,.95), rgba(255,255,255,.3) 72%); }
      /* 沟槽临近伤口处压暗：母版被划开时边缘翘起投下的影 */
      .edge { position:absolute; left:0; right:0; top:327px; height:38px;
        background:linear-gradient(180deg, transparent, rgba(2,8,11,.88)); }
      .wrap { position:absolute; inset:0; z-index:2; }

      .tl { position:absolute; left:76px; top:64px; }
      .status { position:absolute; right:76px; top:58px; font-size:34px; line-height:1; color:rgba(169,199,207,.85); }

      /* 标题被那道划伤切断：上半抬升 + 下半下沉，中间是母版被划开的空档 */
      h1.torn { position:absolute; left:76px; top:337px; width:820px; height:62px; }
      h1.torn span { position:absolute; left:0; top:0; white-space:nowrap;
        font-size:62px; font-weight:700; line-height:1; }
      h1.torn .up { clip-path:inset(0 0 45.5% 0); transform:translateX(7px); }
      h1.torn .dn { clip-path:inset(61% 0 0 0); transform:translateX(-5px); color:rgba(243,249,250,.84); }

      .hurt { position:absolute; left:904px; top:364px; font-size:15.5px; letter-spacing:.12em; color:var(--muted); }
      .skip { position:absolute; right:76px; top:407px; }

      .sub { position:absolute; left:76px; top:460px; width:540px; font-size:15.5px; line-height:1.9; color:var(--muted); }
      .back { position:absolute; left:76px; top:558px; font-size:17px; color:var(--paper);
        text-decoration:none; border-bottom:1px solid var(--coral); padding-bottom:5px; }
      .rule { position:absolute; left:76px; top:626px; width:684px; height:1px; background:var(--line); }
      .alt { position:absolute; left:76px; top:650px; font-size:14.5px; color:var(--muted); }
      .links { position:absolute; left:76px; top:684px; display:flex; align-items:center; gap:44px; }
      .links a { font-size:15px; color:var(--glass); text-decoration:underline; text-underline-offset:5px; }
      .links i { display:block; width:1px; height:12px; background:rgba(127,209,217,.45); }
      .pair { display:flex; align-items:center; gap:9px; }
    </style>
  </head>
  <body>
    <div class="clip">
      <div class="platter"></div>
      <div class="groove"></div>
      <div class="edge"></div>

      <!-- 划伤：沟槽从画外盘面斜切下来，在这一段被豁开；唱针停在豁口里，后面的沟槽整条往下错了一格 -->
      <svg class="art" width="1440" height="900" viewBox="0 0 1440 900" fill="none" aria-hidden="true">
        <!-- 划伤本体：细口横穿整页，从画外进来、从画外出去 -->
        <path d="M 0 369 C 160 365, 320 372, 470 367 C 620 362, 760 371, 878 367"
          stroke="rgba(2,8,11,.85)" stroke-width="11" />
        <path d="M 0 366 C 160 363, 320 370, 470 365 C 620 360, 760 369, 878 365"
          stroke="rgba(228,249,252,.34)" stroke-width="1.3" />
        <path d="M 0 376 C 160 373, 320 380, 470 375 C 620 370, 760 379, 878 374"
          stroke="rgba(228,249,252,.07)" stroke-width="1" />

        <!-- 豁口：这一段的母版被彻底撕开（跳针就卡在这里） -->
        <path d="M 878 365 L 892 348 L 918 361 L 944 350 L 972 358 L 1004 345 L 1032 357 L 1064 347
                 L 1090 360 L 1122 348 L 1148 359 L 1176 351 L 1200 367
                 L 1200 393 L 1170 385 L 1140 396 L 1108 385 L 1078 398 L 1046 386 L 1014 397
                 L 982 385 L 950 396 L 920 384 L 892 391 L 878 376 Z"
          fill="rgba(2,8,11,.9)" stroke="rgba(228,249,252,.16)" />
        <path d="M 884 355 L 818 327" stroke="rgba(228,249,252,.14)" />
        <path d="M 902 349 L 872 307" stroke="rgba(228,249,252,.11)" />
        <path d="M 1206 369 L 1262 347" stroke="rgba(228,249,252,.14)" />
        <path d="M 1204 389 L 1276 399" stroke="rgba(228,249,252,.1)" />
        <path d="M 946 357 L 962 351" stroke="rgba(203,238,246,.35)" />
        <path d="M 1120 351 L 1138 355" stroke="rgba(203,238,246,.3)" />
        <!-- 豁口下游：沟槽整条错下去一格，刻度重新开始 -->
        <path d="M 1200 387 L 1440 391" stroke="rgba(228,249,252,.24)" stroke-width="1.2" />
        <g stroke="rgba(228,249,252,.2)">
          <path d="M 1216 391 L 1216 399" /><path d="M 1242 391 L 1242 399" /><path d="M 1268 391 L 1268 399" />
          <path d="M 1294 392 L 1294 400" /><path d="M 1320 392 L 1320 400" /><path d="M 1346 392 L 1346 400" />
          <path d="M 1372 392 L 1372 400" /><path d="M 1398 392 L 1398 400" /><path d="M 1424 392 L 1424 400" />
        </g>
        <!-- 唱针：从右下压上来，针尖落在豁口里 -->
        <path d="M 1390 936 L 1166 391" stroke="rgba(228,249,252,.26)" stroke-width="2.4" />
        <rect x="1148" y="377" width="34" height="9" rx="2" transform="rotate(-30 1165 381)"
          fill="rgba(228,249,252,.14)" stroke="rgba(228,249,252,.38)" />
        <path d="M 1164 387 L 1170 397" stroke="rgba(203,238,246,.6)" stroke-width="1.6" />
        <circle cx="1355" cy="866" r="9" stroke="rgba(228,249,252,.3)" />
        <circle cx="1355" cy="866" r="3.5" fill="rgba(3,17,23,.95)" stroke="rgba(228,249,252,.3)" />
      </svg>
      <div class="glint"></div>
    </div>

    <div class="wrap">
      <span class="cat tl">SIDE ? · 跳针</span>
      <span class="status">404</span>

      <h1 class="torn">
        <span class="up">找不到这一页</span>
        <span class="dn" aria-hidden="true">找不到这一页</span>
      </h1>

      <p class="hurt">这条水路不存在</p>
      <span class="cat skip">跳针</span>

      <p class="sub">这个地址可能是旧的，或者瓶子已经被别人接走、链接失效了。</p>
      <a class="back" href="#">回首页</a>

      <span class="rule"></span>
      <p class="alt">也可以换个入口继续：</p>
      <nav class="links" aria-label="换个入口">
        <span class="pair"><i></i><a href="#">去河道捞一个漂流瓶</a></span>
        <span class="pair"><i></i><a href="#">去公海听完成的作品</a></span>
      </nav>
    </div>
  </body>
</html>
